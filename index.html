se and mental health diagnoses is a recognized driver of health inequity.<\/p>\n<ul><li>Reassignment moves the problem without addressing the bias, and the bias will come up again with other clients.<\/li>\n<li>Keeping to required tasks makes the inequitable care worse.<\/li>\n<li>Telling the client staff are uncomfortable shames him and damages trust.<\/li><\/ul>", "tip": ""}, {"id": "ET51", "u": "ET", "topic": "Equity, access, stigma, isolation", "t": "single", "stem": "Health information for clients should be written at or below which reading level?", "o": [["6th grade", true, ""], ["3rd grade", false, ""], ["8th grade", false, ""], ["10th grade", false, ""]], "r": "<p>Research recommends that health information be written at a sixth-grade reading level or lower, using plain language, visual aids, and step-by-step breakdowns.<\/p>\n<ul><li>Eighth grade is the most common near-miss because it is often quoted as the average adult reading level. Materials written to the average still miss many clients.<\/li>\n<li>Third and tenth grade are further off from the recommended level.<\/li><\/ul>", "tip": ""}, {"id": "ET55", "u": "ET", "topic": "Equity, access, stigma, isolation", "t": "single", "stem": "A client with hypertension lives in a neighborhood where the closest store is a gas station, and the nearest grocery store with fresh produce is an hour away by bus. The nurse recognizes this as a food desert, which <em>best<\/em> describes:", "o": [["Limited access to affordable fresh food, so cheap processed foods dominate", true, ""], ["A complete absence of any food sources anywhere within the community", false, ""], ["An inability to afford any food at all, requiring emergency food assistance", false, ""], ["A personal preference for processed foods over fresh fruits and vegetables", false, ""]], "r": "<p>A food desert doesn’t mean people have no access to food. It means people lack access to, or can’t afford, fruits and vegetables, while processed foods are available and cheap. It is a structural equity issue that affects chronic disease management.<\/p>\n<ul><li>A complete absence of food overstates it. Some food is available.<\/li>\n<li>Being unable to afford any food describes food insecurity, a related but different concept.<\/li>\n<li>Personal preference blames the individual and ignores the structural barrier.<\/li><\/ul>", "tip": ""}, {"id": "ET63", "u": "ET", "topic": "Equity, access, stigma, isolation", "t": "single", "stem": "A student says, “Our way of making health decisions individually is just the right way. Families who let elders decide are holding the patient back.” This statement is an example of:", "o": [["Ethnocentrism", true, ""], ["Stereotyping", false, ""], ["A microaggression", false, ""], ["Cultural humility", false, ""]], "r": "<p>Smith defines ethnocentrism as identifying and judging others from one’s own cultural perspective. The student treats her own cultural norm, individual decision making, as the correct standard and judges other practices against it.<\/p>\n<ul><li>Stereotyping assigns fixed traits to everyone in a group. The student is ranking cultural practices against her own.<\/li>\n<li>A microaggression is a subtle, often nonverbal slight, such as eye rolling, loud sighs, or a closed posture. This is an explicit judgment.<\/li>\n<li>Cultural humility is lifelong self-reflection and openness, the opposite of this stance.<\/li><\/ul>", "tip": ""}, {"u": "ET", "topic": "Equity, access, stigma, isolation", "t": "single", "stem": "Three weeks after colostomy surgery, a client who lives with his spouse has stopped attending his weekly church group and declines visitors. He says, “I don’t want to explain this bag to anyone.” Which intervention is most appropriate?", "o": [["Refer him to an ostomy support group or a peer visitor", true, ""], ["Encourage him to wait until he feels fully ready to rejoin", false, ""], ["Reassure him that living with his spouse keeps him connected", false, ""], ["Ask his spouse to invite church friends to visit him at home", false, ""]], "r": "<p>Burns, amputations, or an ostomy can bring shame and poor body image that lead someone to isolate, even without any socioeconomic barrier. Connecting him with people who live with an ostomy addresses the shame and builds self-management confidence.<\/p><ul><li>Waiting until he feels “fully ready” reinforces the avoidance and lets the isolation deepen.<\/li><li>Living with a spouse doesn’t rule out isolation. Social isolation doesn’t require living alone.<\/li><li>Arranging visits through his spouse overrides his stated wishes and doesn’t address the body-image fear driving the withdrawal.<\/li><\/ul><p class=\"principle\"><b>Deciding principle:<\/b> address the underlying cause (body image) and reconnect him with peers, while respecting his autonomy.<\/p>", "tip": "", "id": "ET54c"}];
const UNITS=[["ALL","All units"],["GI","GI & Elimination"],["FE","F&E · CKD · GU"],["TI","Tissue Integrity"],["ET","Ethics & Advocacy"]];
const UNAME={GI:"GI",FE:"F&E",TI:"Tissue",ET:"Ethics"};
const KEY="n2000-ex3-v1";
let store={res:{},unit:"ALL",order:null};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.res)store=Object.assign(store,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const byId={};ITEMS.forEach(q=>byId[q.id]=q);
if(!store.order||store.order.length!==ITEMS.length||!store.order.every(id=>byId[id]))store.order=shuf(ITEMS.map(q=>q.id));
let missOnly=false,newOnly=false,list=[],idx=0;
const work={}; // per-session: {perm, sel, done}
function W(q){if(!work[q.id])work[q.id]={perm:shuf(q.o.map((_,i)=>i)),sel:[],done:false};return work[q.id]}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function build(keepId){
  list=store.order.map(id=>byId[id]).filter(q=>(store.unit==="ALL"||q.u===store.unit)
    &&(!missOnly||store.res[q.id]===false)&&(!newOnly||store.res[q.id]===undefined));
  idx=0; if(keepId){const k=list.findIndex(q=>q.id===keepId); if(k>=0)idx=k;}
  chips(); render();
}
function chips(){
  const u=$("units");u.innerHTML="";
  UNITS.forEach(([k,l])=>{const n=k==="ALL"?ITEMS.length:ITEMS.filter(q=>q.u===k).length;
    const b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",store.unit===k);
    b.innerHTML=esc(l)+' <span class="n">'+n+'</span>';b.onclick=()=>{store.unit=k;save();build()};u.appendChild(b)});
  const inU=q=>store.unit==="ALL"||q.u===store.unit;
  $("missN").textContent=ITEMS.filter(q=>inU(q)&&store.res[q.id]===false).length;
  $("newN").textContent=ITEMS.filter(q=>inU(q)&&store.res[q.id]===undefined).length;
  $("missBtn").setAttribute("aria-pressed",missOnly);$("newBtn").setAttribute("aria-pressed",newOnly);
  const sc=$("score");sc.innerHTML="";
  ["GI","FE","TI","ET"].forEach(k=>{const qs=ITEMS.filter(q=>q.u===k);const a=qs.filter(q=>store.res[q.id]!==undefined).length;
    const c=qs.filter(q=>store.res[q.id]===true).length;
    const d=document.createElement("div");d.className="sc";
    d.innerHTML='<b class="u-'+k+'">'+UNAME[k]+'</b><span>'+a+'/'+qs.length+' done</span><span>'+(a?Math.round(100*c/a)+'% correct':'—')+'</span>';sc.appendChild(d)});
}
function render(){
  const card=$("card");
  $("prevBtn").disabled=idx<=0;$("nextBtn").disabled=idx>=list.length-1;
  $("pos").textContent=list.length?("Item "+(idx+1)+" of "+list.length):"0 items";
  $("barFill").style.width=list.length?(100*(idx+1)/list.length)+"%":"0";
  if(!list.length){card.className="card";card.innerHTML='<p class="empty">'+(missOnly?"No missed items here. Turn off “Missed only” to keep going.":"Every item in this view is answered. Turn off the filter to review them.")+'</p>';return}
  const q=list[idx],w=W(q),sata=q.t==="sata";
  card.className="card"+(w.done?" done":"");
  let h='<div class="qhead"><span class="tag u-'+q.u+'">'+UNAME[q.u]+'</span><span>'+esc(q.topic)+'</span>'
    +(store.res[q.id]===false?'<span style="color:var(--bad)">· missed before</span>':store.res[q.id]===true?'<span style="color:var(--ok)">· correct before</span>':'')+'</div>';
  h+='<p class="stem">'+q.stem+'</p>';
  if(sata)h+='<div class="hint">Select all that apply</div>';
  h+='<ul class="opts">';
  w.perm.forEach(i=>{const o=q.o[i],on=w.sel.includes(i);let cls="opt",v="";
    if(w.done){ if(o[1]&&on){cls+=" right";v="Correct choice"} else if(o[1]){cls+=" missed";v="Should have been chosen"} else if(on){cls+=" wrong";v="Incorrect choice"} }
    h+='<li><label class="'+cls+'"><input type="'+(sata?"checkbox":"radio")+'" name="opt" value="'+i+'"'+(on?" checked":"")+(w.done?" disabled":"")+'><span class="t">'+o[0]
      +(w.done&&v?'<span class="verdict">'+v+'</span>':'')+(w.done&&o[2]?'<span class="note">'+o[2]+'</span>':'')+'</span></label></li>'});
  h+='</ul>';
  if(!w.done) h+='<div class="actions"><button class="btn" id="subBtn" type="button"'+(w.sel.length?'':' disabled')+'>Check answer</button></div>';
  else{
    const ok=isRight(q,w.sel);
    h+='<div class="result '+(ok?"ok":"bad")+'">'+(ok?"Correct":"Not quite")+'</div>';
    if(q.r||q.tip){h+='<div class="why">'+(q.r||'')+(q.tip?'<div class="tip"><b>Key point</b>'+q.tip+'</div>':'')+'</div>'}
  }
  card.innerHTML=h;
  if(!w.done){
    card.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{const v=+inp.value;
      if(sata)w.sel=inp.checked?w.sel.concat(v):w.sel.filter(x=>x!==v);else w.sel=[v];
      $("subBtn").disabled=!w.sel.length});
    $("subBtn").onclick=()=>{w.done=true;store.res[q.id]=isRight(q,w.sel);save();chips();render()};
  }
}
function isRight(q,sel){const c=q.o.map((o,i)=>o[1]?i:-1).filter(i=>i>=0);return c.length===sel.length&&c.every(i=>sel.includes(i))}
$("prevBtn").onclick=()=>{if(idx>0){idx--;render();window.scrollTo({top:0})}};
$("nextBtn").onclick=()=>{if(idx<list.length-1){idx++;render();window.scrollTo({top:0})}};
$("missBtn").onclick=()=>{missOnly=!missOnly;if(missOnly)newOnly=false;build()};
$("newBtn").onclick=()=>{newOnly=!newOnly;if(newOnly)missOnly=false;build()};
$("shufBtn").onclick=()=>{store.order=shuf(store.order);for(const k in work)delete work[k];save();build()};
function resetLink(){$("resetWrap").innerHTML='<button class="linkish" id="resetBtn" type="button">Clear all progress</button>';
  $("resetBtn").onclick=()=>{$("resetWrap").innerHTML='<span class="confirm">Clear every answer? <button class="linkish" id="yes" type="button">Yes, clear</button><button class="linkish" id="no" type="button">Cancel</button></span>';
    $("yes").onclick=()=>{store.res={};for(const k in work)delete work[k];save();resetLink();build()};$("no").onclick=resetLink}}
resetLink();
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;
  if(e.key==="ArrowRight")$("nextBtn").click();if(e.key==="ArrowLeft")$("prevBtn").click()});
build();
</script>
