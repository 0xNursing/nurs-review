<style>
/* Layout: sticky control strip (unit filter + progress), then one question card in a ~44rem column; feedback opens beneath the options. Charting-teal accent, unit colors as small tags only. */
:root{
  --bg:#f3f5f5; --surface:#ffffff; --ink:#18232a; --muted:#56656d; --line:#d5dddf; --veil:#e8eeef;
  --accent:#0e6b72; --accent-soft:#dcefef;
  --ok:#2f7a3c; --ok-soft:#e2f1e3; --bad:#b0372b; --bad-soft:#f8e3df; --miss:#9a6a00; --miss-soft:#fbf0d4;
  --gi:#8d4a2f; --fe:#2f5f9a; --ti:#6c4f93; --et:#3f6f4a;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12181b; --surface:#1a2226; --ink:#e4ebed; --muted:#9aa9b0; --line:#2e3a40; --veil:#243035;
  --accent:#5fc4c9; --accent-soft:#163437;
  --ok:#7fca86; --ok-soft:#18301b; --bad:#f08c7e; --bad-soft:#3a1d19; --miss:#e8bd5c; --miss-soft:#352a12;
  --gi:#e0a083; --fe:#8db6ea; --ti:#bba2e2; --et:#94c69f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --surface:#1a2226; --ink:#e4ebed; --muted:#9aa9b0; --line:#2e3a40; --veil:#243035;
  --accent:#5fc4c9; --accent-soft:#163437;
  --ok:#7fca86; --ok-soft:#18301b; --bad:#f08c7e; --bad-soft:#3a1d19; --miss:#e8bd5c; --miss-soft:#352a12;
  --gi:#e0a083; --fe:#8db6ea; --ti:#bba2e2; --et:#94c69f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:44rem;margin:0 auto;padding-block:20px 72px;display:flex;flex-direction:column;gap:18px}
h1{font:700 clamp(26px,5vw,36px)/1.1 var(--display);margin:0;text-wrap:balance;letter-spacing:.005em}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{margin:6px 0 0;color:var(--muted);font-size:15.5px}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.strip-in{max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{font:600 14px/1 var(--display);letter-spacing:.02em;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .n{font:500 11.5px/1 var(--mono);color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip.tog[aria-pressed="true"]{background:var(--miss-soft);border-color:var(--miss);color:var(--ink)}
.chip:disabled{opacity:.45;cursor:default}
.chip:focus-visible,.btn:focus-visible,.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.spacer{flex:1}
.meta{font:500 12.5px/1.3 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--veil);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 12px/1.2 var(--mono);color:var(--muted);letter-spacing:.04em}
.tag{font:600 12px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:4px;border:1px solid currentColor}
.u-GI{color:var(--gi)} .u-FE{color:var(--fe)} .u-TI{color:var(--ti)} .u-ET{color:var(--et)}
.stem{font-size:18.5px;line-height:1.5;margin:0}
.hint{font:600 13px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:11px 13px;cursor:pointer;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt input{margin:4px 0 0;accent-color:var(--accent);width:17px;height:17px}
.opt .t{min-width:0}
.opt .note{display:block;font-size:15px;color:var(--muted);margin-top:5px}
.opt .verdict{display:block;font:600 12px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.done .opt{cursor:default}
.done .opt:hover{border-color:var(--line)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .verdict{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .verdict{color:var(--bad)}
.opt.missed{border-color:var(--miss);background:var(--miss-soft)}
.opt.missed .verdict{color:var(--miss)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{font:600 15px/1 var(--display);letter-spacing:.03em;border-radius:7px;padding:11px 16px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.result{font:700 17px/1.2 var(--display);letter-spacing:.02em}
.result.ok{color:var(--ok)} .result.bad{color:var(--bad)}
.why{border-top:1px solid var(--line);padding-top:12px;font-size:16px;display:flex;flex-direction:column;gap:8px}
.why p,.why ul{margin:0} .why ul{padding-left:1.2em} .why li{margin:3px 0}
.why .principle,.tip{background:var(--accent-soft);border-radius:6px;padding:9px 12px;font-size:15.5px}
.tip b{font:600 12px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.score{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:3px;min-width:0}
.sc b{font:600 13px/1.2 var(--display);letter-spacing:.04em}
.sc span{font:500 13px/1.3 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:560px){.score{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:16px 14px}.stem{font-size:17.5px}}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
footer{font-size:14px;color:var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.confirm{display:inline-flex;gap:8px;align-items:center;font-size:14px}
</style>

<script>
const ITEMS = [{"id": "GI4", "u": "GI", "topic": "Assessment", "t": "single", "stem": "The nurse is preparing to assess a client’s abdomen. Which sequence should the nurse follow?", "o": [["Inspection, auscultation, percussion, palpation", true, ""], ["Inspection, palpation, percussion, auscultation", false, ""], ["Inspection, percussion, auscultation, palpation", false, ""], ["Inspection, auscultation, palpation, percussion", false, ""]], "r": "<p>The abdomen is the exception to the usual sequence: auscultate right after inspection, because percussion and palpation can change bowel sounds. Inspection, palpation, percussion, auscultation is the standard order for other body systems, which is why it is tempting. Percussing before auscultating alters bowel sounds, and palpation is always last because it is the most likely to stimulate the bowel and cause guarding.<\/p>", "tip": ""}, {"id": "GI7", "u": "GI", "topic": "Assessment", "t": "single", "stem": "A nursing student has auscultated a patient’s abdomen and noted one or two bowel sounds in a 2-minute period of time. How would you tell the student to document the patient’s bowel sounds?", "o": [["Hypoactive", true, ""], ["Normal", false, ""], ["Hyperactive", false, ""], ["Paralytic ileus", false, ""]], "r": "<p>Documenting bowel sounds is based on assessment findings. The terms normal (sounds heard about every 5 to 20 seconds), hypoactive (one or two sounds in 2 minutes), hyperactive (5 to 6 sounds heard in less than 30 seconds), or absent (no sounds in 3 to 5 minutes) are frequently used in documentation. Paralytic ileus is a medical diagnosis that may cause absent or hypoactive bowel sounds, but the nurse would not independently document this diagnosis.<\/p>", "tip": ""}, {"id": "GI9", "u": "GI", "topic": "Assessment", "t": "single", "stem": "A nurse is caring for a newly admitted patient with a suspected GI bleed. The nurse assesses the patient’s stool after a bowel movement and notes it to be a tarry-black color. This finding is suggestive of bleeding from what location?", "o": [["Upper GI tract", true, ""], ["Sigmoid colon", false, ""], ["Large intestine", false, ""], ["Anus or rectum", false, ""]], "r": "<p>Blood shed in sufficient quantities in the upper GI tract will produce a tarry-black color (melena). Blood entering the lower portion of the GI tract or passing rapidly through it will appear bright or dark red. Lower rectal or anal bleeding is suspected if there is streaking of blood on the surface of the stool or if blood is noted on toilet tissue.<\/p>", "tip": ""}, {"id": "GI10", "u": "GI", "topic": "Assessment", "t": "single", "stem": "A client taking ferrous sulfate and bismuth subsalicylate (Pepto-Bismol) reports black stools. Vital signs are stable and hemoglobin is unchanged from last week. Which response is best?", "o": [["Explain that iron and bismuth commonly darken stool, and continue to monitor", true, ""], ["Hold the iron and notify the provider of a suspected upper GI bleed", false, ""], ["Collect a stool sample for C. difficile testing before the next dose", false, ""], ["Explain that the dark color means the iron is not being absorbed", false, ""]], "r": "<p>Iron supplements, bismuth (Pepto-Bismol), and licorice all darken stool and frequently frighten clients because black stool can signal an upper GI bleed. With stable vital signs and an unchanged hemoglobin, the expected medication effect is the best explanation, while the nurse keeps watching for true bleeding signs such as tachycardia, hypotension, or tarry, sticky melena. C. difficile causes diarrhea, not black stool, and darkening does not indicate failed iron absorption.<\/p>", "tip": ""}, {"id": "GI19", "u": "GI", "topic": "Constipation", "t": "single", "stem": "A bedridden older adult on scheduled oxycodone has had no formed stool for 5 days and now has small amounts of liquid stool leaking, with a feeling of incomplete emptying. What does the nurse suspect first?", "o": [["Fecal impaction with liquid stool leaking around it", true, ""], ["Clostridioides difficile infection acquired in the facility", false, ""], ["Viral gastroenteritis causing acute diarrhea", false, ""], ["Opioid withdrawal causing increased gut motility", false, ""]], "r": "<p>An uncommon presentation of constipation is watery, diarrhea-like stool that leaks around a large, hard mass the client cannot pass, together with the sensation of not getting it all out. Opioids, immobility, and 5 days without formed stool all point to impaction, which may need digital removal. C. difficile and viral illness cause true diarrhea without the preceding days of no stool, and the client is on scheduled opioids, so withdrawal does not fit.<\/p>", "tip": ""}, {"id": "GI21", "u": "GI", "topic": "Constipation", "t": "single", "stem": "A client’s constipation persists despite increased fluid, fiber, and activity. Which sequence reflects the stepwise medication approach recommended for constipation?", "o": [["Oral laxative or stool softener, then suppository, then enema", true, ""], ["Enema, then suppository, then oral laxative or stool softener", false, ""], ["Suppository, then oral laxative or stool softener, then enema", false, ""], ["Oral laxative or stool softener, then enema, then suppository", false, ""]], "r": "<p>Medications for constipation follow a stepwise approach: start with oral agents, then move to suppositories, and use enemas last. Enemas can interfere with the defecation reflex, and repeated suppository or enema use can damage the rectal mucosa and create laxative dependence, so none of these are meant for long-term use.<\/p>", "tip": ""}, {"id": "GI22", "u": "GI", "topic": "Constipation", "t": "single", "stem": "An older adult who resides in an assisted living facility has sought care from the nurse because of recurrent episodes of constipation. Which of the following actions should the nurse first perform?", "o": [["Assess the patient’s food and fluid intake.", true, ""], ["Encourage the patient to take stool softener daily.", false, ""], ["Assess the patient’s surgical history.", false, ""], ["Encourage the patient to take fiber supplements.", false, ""]], "r": "<p>The nurse should follow the nursing process and perform an assessment prior to interventions. The patient’s food and fluid intake is more likely to affect bowel function than surgery.<\/p>", "tip": ""}, {"u": "GI", "topic": "Constipation", "t": "sata", "stem": "A client reports new constipation. The nurse reviews the home medication list. Which medications are likely contributing? Select all that apply.", "o": [["Verapamil", true, "A calcium channel blocker. CCBs relax smooth muscle in the gut as well as in vessels, slowing peristalsis."], ["Oxybutynin", true, "An anticholinergic. Blocking acetylcholine slows GI motility (same reason diphenhydramine constipates)."], ["Ferrous sulfate", true, "Iron supplements are a classic cause of hard, dark stools."], ["Oxycodone", true, "Opioids bind gut mu receptors and slow transit, which is why scheduled opioids need a bowel regimen."], ["Lisinopril", false, "ACE inhibitors lower blood pressure without a meaningful constipating effect; the near-miss is assuming every antihypertensive slows the gut, when only the calcium channel blockers do."], ["Metformin", false, "Metformin more often causes diarrhea and GI upset, not constipation."], ["Levothyroxine", false, "At a therapeutic dose, thyroid replacement speeds bowel function. Hypothyroidism, not its treatment, causes constipation."]], "r": "", "tip": "Common constipating drugs: opioids, anticholinergics (diphenhydramine, oxybutynin), CCBs, diuretics, calcium, iron, antacids (Tums), some antidepressants and antipsychotics.", "id": "NEW_CONST"}, {"id": "GI26", "u": "GI", "topic": "Diarrhea", "t": "single", "stem": "A client has had loose stools for 3 weeks. How should the nurse classify this diarrhea?", "o": [["Persistent", true, ""], ["Acute", false, ""], ["Chronic", false, ""], ["Recurrent", false, ""]], "r": "<p>Acute diarrhea is self-limiting over 1–2 days and usually viral, persistent diarrhea lasts 2–4 weeks, and chronic diarrhea lasts more than 4 weeks and may return sporadically. At 3 weeks this client is past the acute window but not yet chronic. Recurrent is not one of the standard classifications.<\/p>", "tip": ""}, {"id": "GI28", "u": "GI", "topic": "Diarrhea", "t": "single", "stem": "An older adult has had 8 watery stools in 24 hours and reports dizziness when standing. What is the nurse’s priority action?", "o": [["Assess for dehydration, including orthostatic vital signs", true, ""], ["Encourage oral fluids and an electrolyte replacement drink", false, ""], ["Obtain a stool specimen for pathogen testing", false, ""], ["Apply barrier cream to protect the perianal skin", false, ""]], "r": "<p>Dehydration with electrolyte loss is the main complication of diarrhea, and dizziness on standing in an older adult signals both volume depletion and fall risk. Assessment comes before intervention, so the nurse first measures orthostatic vital signs and fluid status, which then guides whether oral or IV fluids are needed. Stool testing and skin protection are appropriate but address less urgent problems.<\/p>", "tip": ""}, {"id": "GI30", "u": "GI", "topic": "Diarrhea", "t": "single", "stem": "A nurse is caring for an older adult who has been experiencing severe Clostridium difficile-related diarrhea. When reviewing the patient’s most recent laboratory tests, the nurse should prioritize which of the following?", "o": [["Potassium level", true, ""], ["White blood cell level", false, ""], ["Creatinine level", false, ""], ["Hemoglobin level", false, ""]], "r": "<p>In elderly patients, it is important to monitor the patient’s serum electrolyte levels closely. Diarrhea is less likely to cause an alteration in white blood cell, creatinine, and hemoglobin levels.<\/p>", "tip": ""}, {"id": "GI32", "u": "GI", "topic": "IBS", "t": "single", "stem": "A client asks how irritable bowel syndrome differs from inflammatory bowel disease. Which statement by the nurse is accurate?", "o": [["IBS alters bowel motility but causes no inflammation or tissue damage.", true, ""], ["IBS causes patchy inflammation that skips sections of the bowel.", false, ""], ["IBS causes continuous inflammation limited to the colon lining.", false, ""], ["IBS causes mild inflammation that heals between flares.", false, ""]], "r": "<p>IBS is a functional disorder of intestinal motility with no inflammation or tissue changes to the mucosa, which is what separates it from IBD. Patchy, skipping inflammation describes Crohn’s disease, and continuous inflammation of the colon lining describes ulcerative colitis. IBS has no inflammation at any stage, not even mild inflammation between flares.<\/p>", "tip": ""}, {"id": "GI34", "u": "GI", "topic": "IBS", "t": "single", "stem": "A 32-year-old woman has had a year of alternating diarrhea and constipation with bloating that improves after a bowel movement. Colonoscopy, blood work, and stool studies are normal. She has a history of anxiety. Which condition is most consistent with these findings?", "o": [["Irritable bowel syndrome", true, ""], ["Crohn’s disease", false, ""], ["Diverticulosis", false, ""], ["Ulcerative colitis", false, ""]], "r": "<p>IBS is a functional motility disorder diagnosed by exclusion, with constipation, diarrhea, or both, plus pain and bloating, and no inflammation or tissue changes. It is most common in women under 45, and most people who seek care have a history of anxiety or depression. Crohn’s disease and ulcerative colitis would show inflammation on colonoscopy and labs, and diverticula would be seen on colonoscopy and are more common with age.<\/p>", "tip": ""}, {"id": "GI36", "u": "GI", "topic": "IBS", "t": "single", "stem": "Which instruction should the nurse include when teaching a client with IBS?", "o": [["Avoid chewing gum and carbonated drinks.", true, ""], ["Follow a low-fiber diet to rest the bowel.", false, ""], ["Eat three large meals instead of snacking.", false, ""], ["Use yogurt and milk to soothe the bowel.", false, ""]], "r": "<p>Gum and carbonation both cause swallowed air, which worsens IBS symptoms. IBS teaching avoids a low-fiber diet (aim for 21–38 g/day, with soluble fiber such as psyllium), favors smaller meals chewed well so the gut does less work, and avoids dairy, caffeine, alcohol, and fatty foods. Large meals and dairy are common triggers.<\/p>", "tip": ""}, {"id": "GI41", "u": "GI", "topic": "GERD", "t": "single", "stem": "Which client is at highest risk for GERD?", "o": [["A 56-year-old with a hiatal hernia who takes nitroglycerin", true, ""], ["A 48-year-old with a normal BMI who drinks one coffee daily", false, ""], ["A 35-year-old who takes lisinopril and walks every day", false, ""], ["A 52-year-old who quit smoking 20 years ago and is active", false, ""]], "r": "<p>GERD risk factors include age over 50, tobacco, heavy alcohol, pregnancy or obesity, hiatal hernia, poor LES tone, low socioeconomic status, and medications such as CCBs, anticholinergics, benzodiazepines, NSAIDs or aspirin, some antidepressants, albuterol, and nitroglycerin. The correct client has three: age, hiatal hernia, and nitroglycerin. The others have one weak factor at most, and lisinopril is not a GERD-risk medication.<\/p>", "tip": ""}, {"id": "GI44", "u": "GI", "topic": "GERD", "t": "sata", "stem": "A nurse is teaching a client newly diagnosed with GERD. Which instructions should the nurse include? Select all that apply.", "o": [["Elevate the head of the bed", true, ""], ["Avoid eating within 3 hours of bedtime", true, ""], ["Choose small, frequent meals", true, ""], ["Lie down for 30 minutes after meals", false, ""], ["Drink a carbonated beverage to relieve bloating", false, ""]], "r": "<p>GERD lifestyle teaching includes elevating the head of the bed, not eating within 3 hours of bedtime, and small, frequent meals so the stomach is never overfilled, along with weight loss, avoiding belly-binding clothing, and avoiding triggers. Lying down after meals lets acid flow back through the lower esophageal sphincter, and carbonated beverages are a common trigger that increases gastric pressure.<\/p>", "tip": ""}, {"id": "GI45", "u": "GI", "topic": "GERD", "t": "single", "stem": "A client with GERD asks when to stop eating before bed. Which instruction should the nurse give?", "o": [["Avoid eating within 3 hours of going to bed", true, ""], ["Avoid eating within 2 hours of going to bed", false, ""], ["Avoid eating within 1 hour of going to bed", false, ""], ["Eat a small snack right before bed to buffer acid", false, ""]], "r": "<p>Teach clients not to lie down after meals and not to eat within 3 hours of bedtime, so the stomach has emptied before the client is flat. Two hours is the near-miss; some sources use it, but 3 hours gives the stomach more time to empty. A bedtime snack stimulates acid secretion and fills the stomach right before lying down.<\/p>", "tip": ""}, {"id": "GI46", "u": "GI", "topic": "GERD", "t": "single", "stem": "A client with long-standing GERD is admitted for another problem. Which assessments are priorities related to the GERD?", "o": [["Aspiration risk, nutritional status, and CBC for anemia", true, ""], ["Bowel sounds, abdominal girth, and stool for occult blood", false, ""], ["Liver enzymes, serum amylase, and serum lipase", false, ""], ["Blood glucose, hemoglobin A1C, and lipid panel", false, ""]], "r": "<p>The nurse’s GERD role is assessing nutritional status, aspiration risk (regurgitated contents can cause aspiration pneumonia), and a CBC for signs of anemia from chronic esophageal irritation or bleeding, plus diet teaching. The other sets fit obstruction, pancreatic or liver disease, and diabetes or cardiac risk rather than reflux.<\/p>", "tip": ""}, {"id": "GI51", "u": "GI", "topic": "Celiac", "t": "single", "stem": "A client is scheduled for a small-bowel biopsy to confirm celiac disease. Which instruction by the nurse is accurate?", "o": [["Keep eating gluten until the biopsy is done.", true, ""], ["Stop eating gluten 2 weeks before the biopsy.", false, ""], ["Stop eating gluten 3 months before the biopsy.", false, ""], ["Eat gluten only on the day of the biopsy.", false, ""]], "r": "<p>Tissue biopsy is the gold standard for celiac disease, and the client must be consuming gluten when it is taken, or the villous changes may not show. Stopping gluten beforehand lets the villi recover and can produce a falsely normal biopsy, and a single day of gluten is not enough to produce changes. After diagnosis, treatment is a gluten-free diet that is low in fat and high in calories and protein.<\/p>", "tip": ""}, {"u": "GI", "topic": "Celiac", "t": "sata", "stem": "A client newly diagnosed with celiac disease asks which grains are safe to eat. Which grains should the nurse include? Select all that apply.", "o": [["Rice", true, "A naturally gluten-free grain."], ["Corn", true, "A naturally gluten-free grain."], ["Buckwheat", true, "Despite the name, buckwheat is not related to wheat and contains no gluten. The name makes it a common near-miss."], ["Millet", true, "A naturally gluten-free grain."], ["Oats", false, "Oats are treated as a gluten source. Pure oats lack gluten, but they are usually cross-contaminated with wheat, so clients are taught to avoid them."], ["Barley", false, "Barley contains gluten (wheat, rye, barley, oats)."], ["Rye", false, "Rye contains gluten (wheat, rye, barley, oats)."]], "r": "", "tip": "Gluten: wheat, rye, barley, oats. Safe: rice, corn, tapioca, millet, buckwheat. Also teach label reading for toothpaste, cosmetics, and medication fillers.", "id": "NEW_CEL"}, {"id": "GI53", "u": "GI", "topic": "Celiac", "t": "single", "stem": "A client with celiac disease follows a strict gluten-free diet but still has symptoms. Which possible sources of gluten should the nurse ask about?", "o": [["Toothpaste, lipstick, and some medications", true, ""], ["Rice, corn, and potato products", false, ""], ["Buckwheat, millet, and tapioca", false, ""], ["Fresh meat, eggs, and vegetables", false, ""]], "r": "<p>Gluten has non-food exposures: some cosmetics and toothpastes contain gluten, and gluten is used as a filler in some medications, so clients with celiac disease learn to read labels on more than food. Rice, corn, potatoes, buckwheat, millet, tapioca, and fresh meat, eggs, and vegetables are naturally gluten-free.<\/p>", "tip": ""}, {"id": "GI55", "u": "GI", "topic": "Celiac", "t": "single", "stem": "Which client should the nurse recognize as high risk for celiac disease and a candidate for screening?", "o": [["A client with type 1 diabetes and a sibling with biopsy-proven celiac disease", true, ""], ["A client with hypertension and a parent with colorectal cancer", false, ""], ["A client with GERD who smokes one pack of cigarettes daily", false, ""], ["A client over 60 with diverticulosis and a low-fiber diet", false, ""]], "r": "<p>High-risk groups for celiac disease include people with other autoimmune conditions (type 1 diabetes, thyroid disease, lupus, rheumatoid arthritis), Down syndrome, and children or siblings of someone with biopsy-proven celiac; these people may be screened with blood tests even without symptoms. The other clients have risk factors for colorectal cancer, GERD, and diverticular disease instead.<\/p>", "tip": ""}, {"id": "GI58", "u": "GI", "topic": "Diverticular", "t": "single", "stem": "How does diverticulitis differ from diverticulosis?", "o": [["Diverticulitis is inflammation or infection of the pouches.", true, ""], ["Diverticulitis is the formation of the pouches.", false, ""], ["Diverticulitis is narrowing of the colon by the pouches.", false, ""], ["Diverticulitis is bleeding from pouches in the ileum.", false, ""]], "r": "<p>Diverticulosis is the formation of pouches (sac-like herniations of the lining) that can occur anywhere in the colon, most often the sigmoid; most people have no symptoms. Diverticulitis is inflammation or infection of those pouches. Narrowing of the colon is a later complication of repeated bouts, and the pouches are in the colon rather than the ileum.<\/p>", "tip": ""}, {"id": "GI61", "u": "GI", "topic": "Diverticular", "t": "single", "stem": "Which finding is the most characteristic of diverticular disease?", "o": [["Left lower quadrant pain that eases after a bowel movement", true, ""], ["Right lower quadrant pain that worsens with walking", false, ""], ["Left lower quadrant pain that eases after eating", false, ""], ["Epigastric pain that eases after eating", false, ""]], "r": "<p>Diverticula usually form in the descending and sigmoid colon on the left side, so the distinguishing symptom is left lower quadrant pain that worsens with eating and improves after a bowel movement. Right lower quadrant pain worsened by movement suggests appendicitis. Eating makes diverticular pain worse rather than better, and epigastric pain relieved by eating suggests a duodenal ulcer.<\/p>", "tip": ""}, {"id": "GI63", "u": "GI", "topic": "Diverticular", "t": "single", "stem": "Which plan should the nurse reinforce for a client with diverticulosis?", "o": [["21–38 g of fiber and 2–3 L of water daily", true, ""], ["21–38 g of fiber and 1 L of water daily", false, ""], ["10–15 g of fiber and 2–3 L of water daily", false, ""], ["A low-residue diet and a daily stool softener", false, ""]], "r": "<p>Diverticular disease management includes 21–38 g of fiber and 2–3 L of water a day, at least 5 servings of fruits and vegetables, whole grains, avoiding processed foods, and possibly OTC fiber, probiotics, and oral antibiotics. One liter of water and 10–15 g of fiber fall short of these targets. A low-residue diet is for IBD flares and new ostomies, and routine stool softeners are not part of the plan.<\/p>", "tip": ""}, {"id": "GI65", "u": "GI", "topic": "Diverticular", "t": "single", "stem": "A client has had several bouts of diverticulitis. Which long-term complication is the nurse most concerned about?", "o": [["Scarring and narrowing of the colon leading to obstruction", true, ""], ["Pseudopolyps leading to toxic megacolon", false, ""], ["Loss of villi leading to iron-deficiency anemia", false, ""], ["Esophageal cell changes leading to cancer", false, ""]], "r": "<p>Repeated bouts of diverticulitis cause scar tissue that narrows the colon and raises the risk of bowel obstruction, which is why preventing recurrence is a goal. Pseudopolyps and toxic megacolon belong to ulcerative colitis, villous loss to celiac disease, and esophageal cell changes to Barrett’s esophagus in GERD.<\/p>", "tip": ""}, {"id": "GI67", "u": "GI", "topic": "Diverticular", "t": "single", "stem": "The nurse receives report on four clients. Which client should the nurse see first?", "o": [["A client with diverticulitis whose abdomen is newly rigid and whose temperature is 101.8°F (38.8°C)", true, ""], ["A client with diverticulosis who is asking for help choosing a high-fiber menu", false, ""], ["A client with ulcerative colitis who has had 4 loose stools this shift with stable vital signs", false, ""], ["A client with a new colostomy who is anxious about changing the pouch for the first time", false, ""]], "r": "<p>A new rigid abdomen with fever in diverticulitis suggests perforation and peritonitis, a surgical emergency, so this is the unstable client and an actual life-threatening problem. Diet teaching, an expected stool pattern with stable vital signs, and anxiety about self-care are real needs, but they can safely wait until the unstable client is assessed.<\/p>", "tip": ""}, {"id": "GI68", "u": "GI", "topic": "IBD", "t": "single", "stem": "Which colonoscopy finding is most consistent with Crohn’s disease rather than ulcerative colitis?", "o": [["Skip lesions with a cobblestone appearance", true, ""], ["Continuous inflammation starting at the rectum", false, ""], ["Friable mucosa with scattered pseudopolyps", false, ""], ["Shallow ulcerations limited to the mucosa", false, ""]], "r": "<p>Crohn’s disease affects all layers of the bowel wall, can occur anywhere from mouth to rectum (most often the terminal ileum), and produces patchy skip lesions with a cobblestone appearance and fat wrapping. Continuous inflammation from the rectum, friable mucosa that bleeds easily with pseudopolyps, and ulcerations confined to the mucosa are all features of ulcerative colitis.<\/p>", "tip": ""}, {"id": "GI75", "u": "GI", "topic": "IBD", "t": "single", "stem": "Which onset and complication pattern is most consistent with ulcerative colitis?", "o": [["Abrupt onset; toxic megacolon is the most serious complication", true, ""], ["Insidious onset; fistulas and abscesses are common", false, ""], ["Abrupt onset; fistulas and abscesses are common", false, ""], ["Insidious onset; toxic megacolon is the most serious complication", false, ""]], "r": "<p>Ulcerative colitis usually has an abrupt onset, affects the mucosa of the large intestine and rectum, causes 4–20 bloody stools a day, and its most life-threatening complication is toxic megacolon; fistulas are uncommon. Crohn’s disease has an insidious onset, and fistulas and abscesses are common in Crohn’s. Each distractor mixes one Crohn’s feature with one UC feature.<\/p>", "tip": ""}, {"id": "GI79", "u": "GI", "topic": "IBD", "t": "single", "stem": "Which finding in a client with an ulcerative colitis flare should the nurse report immediately as possible toxic megacolon?", "o": [["Sudden abdominal distention with fever and tachycardia", true, ""], ["An increase from 6 to 8 bloody stools per day", false, ""], ["Tender red bumps on both shins", false, ""], ["Aching pain in both knees", false, ""]], "r": "<p>Toxic megacolon is a rare, life-threatening complication in which the colon dilates massively and stops working, leading to sepsis, shock, or perforation; new distention with signs of systemic toxicity is an emergency. More bloody stools need monitoring but are expected in a flare, and red shin nodules (erythema nodosum) and large-joint pain are extraintestinal manifestations that are not immediately life-threatening.<\/p>", "tip": ""}, {"id": "GI80", "u": "GI", "topic": "IBD", "t": "single", "stem": "A client with toxic megacolon is receiving IV fluids, glucocorticoids, and antibiotics. If the client does not improve, within what timeframe is a colectomy usually needed?", "o": [["24 to 36 hours", true, ""], ["6 to 12 hours", false, ""], ["48 to 72 hours", false, ""], ["7 to 10 days", false, ""]], "r": "<p>Toxic megacolon is treated first with supportive care (IV fluids, glucocorticoids to reduce inflammation, antibiotics if infected), and if there is no improvement within 24 to 36 hours, surgery, usually a colectomy, is required. Waiting several days risks sepsis, shock, or perforation.<\/p>", "tip": ""}, {"id": "GI81", "u": "GI", "topic": "IBD", "t": "single", "stem": "A client in an ulcerative colitis flare has had 12 bloody stools today. Heart rate is 118, blood pressure 96/58, and hemoglobin 7.4 g/dL. What should the nurse anticipate?", "o": [["Preparing for a blood transfusion", true, ""], ["Scheduling an MRI to look for fistulas", false, ""], ["Starting a high-fiber diet to bulk the stool", false, ""], ["Giving an antidiarrheal and rechecking tomorrow", false, ""]], "r": "<p>Ulcerative colitis causes frequent, chronic bloody stools, so anemia is a major complication and some clients need a transfusion; tachycardia, low blood pressure, and a hemoglobin of 7.4 show active, significant blood loss. MRI is used for abscesses and fistulas, which are uncommon in ulcerative colitis. Fiber is limited during flares, and waiting until tomorrow is unsafe for an unstable client.<\/p>", "tip": ""}, {"id": "GI85", "u": "GI", "topic": "IBD", "t": "sata", "stem": "A client with Crohn’s disease is in a flare. Which dietary choices should the nurse encourage? Select all that apply.", "o": [["Lean, high-protein foods", true, ""], ["Small, frequent meals", true, ""], ["Low-residue, low-fat choices", true, ""], ["Raw broccoli and cabbage salads", false, ""], ["Cold foods and iced drinks", false, ""]], "r": "<p>During an IBD flare the diet is high calorie and high protein (lean proteins are best) to replace nutrients lost to diarrhea, given as small, frequent meals, and kept low fat and low residue to decrease motility and inflammation. Raw broccoli, cabbage, nuts, seeds, and whole grains are avoided during flares, and cold foods are avoided because they increase GI motility.<\/p>", "tip": ""}, {"id": "GI87", "u": "GI", "topic": "IBD", "t": "single", "stem": "A client with Crohn’s disease takes long-term prednisone. Which supplements does the nurse anticipate because of the steroid therapy?", "o": [["Calcium and vitamin D", true, ""], ["Iron and vitamin C", false, ""], ["Potassium and magnesium", false, ""], ["Vitamin B12 and folate", false, ""]], "r": "<p>Many clients with IBD take steroids to reduce inflammation, and chronic steroid use causes bone loss, so calcium and vitamin D are given to prevent osteopenia. Iron may be needed for anemia from bleeding, and B12 may be needed when the terminal ileum is affected, but neither is given because of the steroid. Potassium and magnesium are replaced for losses from diarrhea rather than steroid effects.<\/p>", "tip": ""}, {"id": "GI90", "u": "GI", "topic": "Enteral & TPN", "t": "single", "stem": "Which client is the best candidate for enteral nutrition?", "o": [["A client with dysphagia after a stroke whose GI tract works", true, ""], ["A client with short bowel syndrome after a large resection", false, ""], ["A client with a complete small-bowel obstruction", false, ""], ["A client whose GI tract must rest for the next 3 weeks", false, ""]], "r": "<p>Enteral nutrition is given by tube directly into the stomach or intestine when oral intake is not possible or adequate but the GI tract still works, as with dysphagia after a stroke. Short bowel syndrome, absorption problems, obstruction, and a need to rest the gut for more than 1–2 weeks are indications for parenteral nutrition instead.<\/p>", "tip": ""}, {"id": "GI93", "u": "GI", "topic": "Enteral & TPN", "t": "single", "stem": "Which statement about total parenteral nutrition (TPN) is accurate?", "o": [["It is given IV, usually through a central line, with an in-line filter.", true, ""], ["It is given IV, usually through a peripheral line, with no filter.", false, ""], ["It is given through a jejunal tube, with an in-line filter.", false, ""], ["It is given IV and stopped abruptly when the client starts eating.", false, ""]], "r": "<p>TPN provides protein, carbohydrates, fats, electrolytes, vitamins, trace minerals, and sterile water by IV, generally through a central line, and requires an in-line filter. It is used for short bowel or absorption problems when rest from oral or enteral feeding is expected for more than 1–2 weeks. A jejunal tube delivers enteral nutrition, and TPN is tapered gradually to prevent hypoglycemia.<\/p>", "tip": ""}, {"id": "GI95", "u": "GI", "topic": "Enteral & TPN", "t": "single", "stem": "A client’s total parenteral nutrition (TPN) is being discontinued. Which action by the nurse is correct?", "o": [["Taper the infusion gradually to prevent hypoglycemia", true, ""], ["Stop the infusion abruptly once oral intake begins", false, ""], ["Remove the in-line filter before hanging the final bag", false, ""], ["Increase the rate for the last hour to finish the bag", false, ""]], "r": "<p>TPN is high in glucose, so it is discontinued gradually to let the body adjust to lower glucose levels and avoid rebound hypoglycemia. TPN requires an in-line filter throughout, and speeding up the rate risks hyperglycemia and fluid overload.<\/p>", "tip": ""}, {"id": "GI98", "u": "GI", "topic": "Colorectal cancer", "t": "single", "stem": "A nurse is teaching a group of adults about screening and prevention of colorectal cancer. The nurse should describe which of the following as the most common sign of possible colon cancer?", "o": [["Change in bowel habits", true, ""], ["Development of new hemorrhoids", false, ""], ["Abdominal bloating and flank pain", false, ""], ["Unexplained weight gain", false, ""]], "r": "<p>The most common presenting symptom associated with colorectal cancer is a change in bowel habits. The passage of blood is the second most common symptom. Symptoms may also include unexplained anemia, anorexia, weight loss, and fatigue. Hemorrhoids and bloating are atypical.<\/p>", "tip": ""}, {"id": "GI100", "u": "GI", "topic": "Colorectal cancer", "t": "single", "stem": "A client with no family history had a normal colonoscopy at age 45. How often should screening be repeated, and when can it stop?", "o": [["Every 10 years until age 75", true, ""], ["Every 5 years until age 85", false, ""], ["Every 10 years until age 65", false, ""], ["Every 3 years until age 75", false, ""]], "r": "<p>Colorectal cancer screening starts at age 45, or earlier with a family history, and if results are clean it is repeated every 10 years up to age 75, after which routine screening is not needed.<\/p>", "tip": ""}, {"id": "GI101", "u": "GI", "topic": "Colorectal cancer", "t": "single", "stem": "Which GI condition places a client at the highest risk for colorectal cancer?", "o": [["Ulcerative colitis", true, ""], ["Crohn’s disease", false, ""], ["Irritable bowel syndrome", false, ""], ["Diverticulosis", false, ""]], "r": "<p>Ulcerative colitis raises the risk of colorectal cancer more than Crohn’s disease does. Crohn’s disease also raises risk, but less. IBS causes no inflammation or tissue damage, and diverticulosis is not a recognized colorectal cancer risk factor.<\/p>", "tip": ""}, {"id": "GI106", "u": "GI", "topic": "Ostomy", "t": "single", "stem": "Which client should the nurse expect to have the most liquid ostomy output?", "o": [["A client with an ileostomy", true, ""], ["A client with a transverse colostomy", false, ""], ["A client with a descending colostomy", false, ""], ["A client with a sigmoid colostomy", false, ""]], "r": "<p>Water is absorbed as stool moves through the colon, so the closer the ostomy is to the small intestine, the thinner and more watery the output. An ileostomy (small intestine) produces the most liquid output, a transverse colostomy is mushy, and descending and sigmoid colostomies produce thicker, more formed, more odorous stool.<\/p>", "tip": ""}, {"id": "GI108", "u": "GI", "topic": "Ostomy", "t": "single", "stem": "The nurse assesses a new colostomy. Which stoma finding should the nurse report to the provider immediately?", "o": [["A dusky, purplish-black stoma", true, ""], ["A red, moist stoma that bleeds slightly when cleaned", false, ""], ["A stoma that is swollen on the second postoperative day", false, ""], ["A pink, moist stoma with intact surrounding skin", false, ""]], "r": "<p>A healthy stoma is red, moist, and intact with skin that is not macerated; a dusky, purple, or black stoma signals poor blood supply and possible necrosis and must be reported right away. Slight bleeding when cleaned is expected because the stoma is vascular mucosa, and postoperative swelling is expected and decreases over the following weeks.<\/p>", "tip": ""}, {"id": "GI109", "u": "GI", "topic": "Ostomy", "t": "single", "stem": "On the third day after colostomy surgery, which finding is the nurse’s priority?", "o": [["Increasing abdominal distention with no stoma output", true, ""], ["Incisional pain rated 4/10 after an analgesic", false, ""], ["The client declining to look at the stoma", false, ""], ["Pasty, odorous stool in a sigmoid colostomy pouch", false, ""]], "r": "<p>Abdominal distention is the first common assessment after a colostomy because it can signal obstruction; together with no output, it is an actual physiologic problem that outranks the others. Controlled pain is acceptable, reluctance to look at the stoma is an important psychosocial need to address after physical stability, and pasty stool is expected from a sigmoid colostomy.<\/p>", "tip": ""}, {"id": "GI111", "u": "GI", "topic": "Ostomy", "t": "single", "stem": "A client is 2 weeks out from colostomy surgery and asks about diet. What should the nurse teach?", "o": [["Low-residue diet for 6–8 weeks, adding foods one at a time", true, ""], ["High-fiber diet for 6–8 weeks, adding foods one at a time", false, ""], ["Low-residue diet for 2–3 weeks, adding several foods at once", false, ""], ["Low-residue diet for 6 months, avoiding fruits and vegetables", false, ""]], "r": "<p>A low-residue diet is generally followed for the first 6–8 weeks, with fruits and vegetables strained because they are still important sources of vitamin A and vitamin C, and foods are reintroduced one at a time. Afterward there are few restrictions beyond avoiding hard-to-digest foods such as popcorn kernels, celery, poppy and caraway seeds, and coconut. High fiber early risks blockage, adding several foods at once hides which one caused a problem, and fruits and vegetables are strained rather than avoided.<\/p>", "tip": ""}, {"id": "GI116", "u": "GI", "topic": "Ostomy", "t": "single", "stem": "A patient’s colorectal cancer has necessitated a hemicolectomy with the creation of a colostomy. In the 4 days since the surgery, the patient has been unwilling to look at the ostomy or participate in any aspects of ostomy care. What is the nurse’s most appropriate response to this observation?", "o": [["Acknowledge the patient’s reluctance and initiate discussion of the factors underlying it.", true, ""], ["Ensure that the patient knows that he or she will be responsible for care after discharge.", false, ""], ["Reassure the patient that many people are fearful after the creation of an ostomy.", false, ""], ["Arrange for the patient to be seen by a social worker or spiritual advisor.", false, ""]], "r": "<p>If the patient is reluctant to participate in ostomy care, the nurse should attempt to dialogue about this with the patient and explore the factors that underlie it. It is presumptive to assume that the patient’s behavior is motivated by fear. Assessment must precede referrals and emphasizing the patient’s responsibilities may or may not motivate the patient.<\/p>", "tip": ""}, {"id": "FE1", "u": "FE", "topic": "Fluids & IV", "t": "sata", "stem": "A client has had vomiting and diarrhea for 3 days. Which laboratory findings support fluid volume deficit? Select all that apply.", "o": [["BUN 31 mg/dL", true, "Above the normal range of 10–20 mg/dL. Less plasma water concentrates urea, so BUN rises out of proportion to creatinine in dehydration."], ["Hematocrit 54% in a female client", true, "Above the 35–47% female range. Hemoconcentration raises the percentage of red cells in whole blood."], ["Urine specific gravity 1.032", true, "Above the 1.005–1.025 range. The kidneys conserve water and excrete concentrated urine."], ["Serum sodium 148 mEq/L", true, "Above 145. Water loss in excess of sodium leaves the serum more concentrated."], ["Hematocrit 33% in a female client", false, "A low hematocrit reflects dilution or anemia, which fits fluid volume excess, not deficit."], ["Urine specific gravity 1.004", false, "Dilute urine is the opposite of the compensatory response to hypovolemia. It fits overhydration or an inability to concentrate urine."], ["BUN 9 mg/dL", false, "A low BUN suggests dilution, low protein intake, or liver disease, not dehydration."]], "r": "", "tip": "Fluid loss concentrates everything that stays behind: BUN, hematocrit, sodium, and urine specific gravity all rise."}, {"id": "FE22", "u": "FE", "topic": "Potassium", "t": "sata", "stem": "A client with renal failure has a potassium of 6.9 mEq/L and peaked T waves. Which treatments should the nurse anticipate? Select all that apply.", "o": [["IV calcium gluconate", true, "IV calcium gluconate (or chloride) is a first-line treatment for severe hyperkalemia because it stabilizes the cardiac membrane."], ["Regular insulin IV with hypertonic dextrose", true, "Insulin drives potassium into the cells. Dextrose is given with it to prevent hypoglycemia."], ["Sodium polystyrene sulfonate (Kayexalate)", true, "Exchanges sodium for potassium in the intestine. Retain 30–60 minutes and watch sodium."], ["Hemodialysis", true, "Used for severe cases, especially when the kidneys cannot excrete potassium."], ["Spironolactone", false, "A potassium-sparing diuretic. These raise potassium and should not be used with renal dysfunction."], ["Magnesium sulfate IV", false, "Treats hypomagnesemia. It does not lower potassium."], ["Potassium chloride oral supplement", false, "Adds potassium. This is the treatment for hypokalemia."]], "r": "", "tip": "Severe hyperkalemia: calcium gluconate, insulin with dextrose, Kayexalate, loop diuretics, dialysis. Avoid K-sparing diuretics and salt substitutes."}, {"id": "FE43", "u": "FE", "topic": "CKD", "t": "sata", "stem": "Which laboratory findings should the nurse expect in a client with advanced chronic kidney disease? Select all that apply.", "o": [["Elevated serum creatinine", true, "Creatinine is cleared almost entirely by the kidneys, so it rises as GFR falls."], ["Hyperkalemia", true, "The kidneys excrete about 90% of potassium."], ["Hyperphosphatemia", true, "Phosphate excretion is impaired."], ["Hypocalcemia", true, "Calcium falls as phosphate rises (inverse relationship), and vitamin D is not activated."], ["Metabolic acidosis", true, "The kidneys cannot excrete hydrogen ions or ammonia, or reabsorb bicarbonate."], ["Hypophosphatemia", false, "Phosphate accumulates in CKD rather than dropping."], ["Elevated hemoglobin", false, "Erythropoietin deficiency lowers hemoglobin."]], "r": "", "tip": "CKD labs: everything the kidney excretes goes up (creatinine, BUN, K, phosphate, acid). What depends on the kidney goes down (Ca, Hgb, bicarbonate)."}, {"id": "FE59", "u": "FE", "topic": "Dialysis", "t": "sata", "stem": "Which instructions should the nurse include for a client with a new arteriovenous fistula in the left arm? Select all that apply.", "o": [["Feel for a thrill and listen for a bruit every day", true, "A thrill and bruit confirm the fistula is open. Inpatients are checked every shift (every 8–12 hours)."], ["Do not allow blood pressures to be taken on the left arm", true, "Cuff compression can clot the access."], ["Do not allow IVs or blood draws in the left arm", true, "Punctures risk infection and damage to the access."], ["Avoid carrying a purse or wearing a watch on the left arm", true, "External compression reduces flow."], ["Apply a snug elastic wrap over the site at night", false, "Any constriction can stop flow and clot the fistula."], ["Sleep on the left side to protect the arm", false, "Lying on the arm compresses the access."]], "r": "", "tip": "Protect the access arm: no BP, IVs, or compression. Check thrill and bruit, and watch for bleeding (heparin)."}, {"id": "FE2", "u": "FE", "topic": "Fluids & IV", "t": "single", "stem": "A client with heart failure weighs 1.5 kg more than yesterday at the same time on the same scale. The nurse estimates the client has retained approximately how much fluid?", "o": [["1,500 mL", true, "1 kg of acute weight change equals about 1 L of fluid, so 1.5 kg is about 1,500 mL."], ["150 mL", false, "This applies a tenfold error to the 1 kg = 1 L conversion."], ["500 mL", false, "This underestimates retention. Each kilogram is about a full liter, not a third of one."], ["3,000 mL", false, "This doubles the conversion, perhaps from confusing kilograms with pounds."]], "r": "", "tip": "1 kg = 1 L. Daily weight is the most sensitive measure of acute fluid change."}, {"id": "FE4", "u": "FE", "topic": "Fluids & IV", "t": "single", "stem": "A client is prescribed a 1,000 mL/day fluid restriction. Which distribution plan should the nurse implement?", "o": [["Day shift 500 mL, evening shift 400 mL, night shift 100 mL", true, "This is the recommended plan. Most fluid goes to waking hours, meals, and med passes, with a small amount at night."], ["Day shift 333 mL, evening shift 333 mL, night shift 334 mL", false, "An equal split gives too much fluid at night, when the client is asleep, and leaves too little for meals and medications."], ["Day shift 100 mL, evening shift 400 mL, night shift 500 mL", false, "This reverses the recommended plan. It leaves the client thirsty during the active day and puts most fluid overnight."], ["Day shift 250 mL, evening shift 250 mL, night shift 500 mL", false, "This puts half of the allotment overnight, when it is least needed."]], "r": "", "tip": "Divide the restriction across shifts, weighted toward waking hours (for 1,000 mL: 500 / 400 / 100)."}, {"id": "FE6", "u": "FE", "topic": "Fluids & IV", "t": "single", "stem": "A client with a traumatic brain injury and increased intracranial pressure has new IV prescriptions. Which solution should the nurse question?", "o": [["0.45% sodium chloride", true, "Hypotonic fluid shifts water into cells, including brain cells, and can worsen cerebral edema and ICP."], ["0.9% sodium chloride", false, "Isotonic saline causes no fluid shift between compartments and is commonly used in head injury."], ["Lactated Ringer's", false, "LR is isotonic and does not drive water into brain cells."], ["3% sodium chloride", false, "Hypertonic saline pulls water out of cells into the vascular space and is used to reduce cerebral edema."]], "r": "", "tip": "Safety: hypotonic fluids swell cells. Avoid them when brain swelling is the risk."}, {"id": "FE7", "u": "FE", "topic": "Fluids & IV", "t": "single", "stem": "A client's labs show BUN 38 mg/dL and creatinine 1.0 mg/dL. Which interpretation by the nurse is most accurate?", "o": [["The pattern suggests dehydration rather than kidney damage", true, "BUN is elevated but creatinine is normal (0.6–1.3). BUN reflects hydration status, protein load, and GI bleeding. Creatinine tracks kidney function."], ["The pattern suggests stage 3 chronic kidney disease", false, "CKD staging is based on GFR, which is calculated from creatinine. A normal creatinine does not support significant kidney loss."], ["Both values are within normal limits", false, "Normal BUN is 10–20 mg/dL, so 38 is elevated."], ["The pattern suggests fluid volume excess", false, "Fluid excess dilutes urea and tends to lower BUN."]], "r": "", "tip": "BUN tracks hydration. Creatinine (and GFR) tracks kidney function. BUN high with creatinine normal points to volume, not the kidneys."}, {"id": "FE8", "u": "FE", "topic": "Fluids & IV", "t": "single", "stem": "Which client is at greatest risk for fluid volume deficit?", "o": [["An 86-year-old in long-term care with dementia and diarrhea", true, "Older adults have less total body water (as low as 45%), an impaired thirst response, and may be unable to drink voluntarily. Ongoing GI losses add to all of this."], ["A 45-year-old with heart failure on a 1,500 mL fluid restriction", false, "The restriction is therapeutic for fluid excess. This client's underlying risk is overload, not deficit."], ["A 30-year-old on postoperative day 1 with IV fluids at 125 mL/hr", false, "Continuous IV replacement offsets surgical losses, and this client can report thirst."], ["A 60-year-old on hemodialysis three times per week", false, "Between runs, the dialysis client is at risk for fluid excess, not deficit."]], "r": "", "tip": "The lifespan extremes (older adults, infants) are most sensitive to fluid loss. Combine low reserve, impaired thirst, and active losses."}, {"id": "FE10", "u": "FE", "topic": "Fluids & IV", "t": "single", "stem": "The nurse is monitoring a client at risk for fluid volume excess. Which finding is typically the earliest indicator?", "o": [["Acute weight gain on daily weights", true, "Weight gain (with edema) as the first sign of FVE. Weight changes before crackles or JVD develop."], ["Fine crackles in the lung bases", false, "Crackles appear once fluid has already reached the alveoli, which is later than a measurable weight change."], ["Jugular vein distention at 45 degrees", false, "JVD reflects significant venous volume and pressure. It is a later finding than weight gain."], ["A new S3 heart sound on auscultation", false, "An S3 reflects an overloaded ventricle. It is a cardiac consequence, not the first sign."]], "r": "", "tip": "Daily weight is the most sensitive early measure: 1 kg = 1 L."}, {"id": "FE15", "u": "FE", "topic": "Sodium", "t": "single", "stem": "A client's serum sodium is 118 mEq/L. The client is newly confused and has muscle twitching. Which action is the nurse's priority?", "o": [["Implement seizure precautions", true, "Severe hyponatremia causes cerebral edema. Seizures and coma are the dangerous outcome, so protecting the client comes first."], ["Restrict free water intake", false, "Water restriction is part of treatment, but it corrects sodium over hours and does not protect against an imminent seizure."], ["Encourage foods high in sodium", false, "Dietary replacement is too slow for a sodium of 118 with neuro changes, and a confused client may be unsafe to eat."], ["Reorient the client and document the change", false, "Reorientation is supportive, but documenting without acting on a severe value and new neuro findings delays safety measures."]], "r": "", "tip": "Safety first. Neuro changes with a severe sodium value (high or low) call for seizure precautions."}, {"id": "FE16", "u": "FE", "topic": "Sodium", "t": "single", "stem": "A client with a sodium of 158 mEq/L is started on a hypotonic IV solution. Two hours later, which finding should the nurse report immediately?", "o": [["New headache with decreasing level of consciousness", true, "Correcting too fast shifts water back into brain cells and causes cerebral edema. That is why hypernatremia must be corrected slowly."], ["Continued thirst with a dry, sticky oral mucosa", false, "Thirst is an expected finding that resolves gradually as the sodium normalizes."], ["Temperature of 99.8°F (37.7°C) with flushed skin", false, "Low-grade fever is part of hypernatremia and should be monitored, but it is not the emergency here."], ["Urine output of 50 mL/hr over the past 2 hours", false, "This is adequate output (above 30 mL/hr) and does not indicate a complication."]], "r": "", "tip": "Actual vs. potential: a neuro change during correction is an actual complication (cerebral edema). Correct slowly."}, {"id": "FE17", "u": "FE", "topic": "Sodium", "t": "single", "stem": "A client with a head injury develops SIADH and a sodium of 128 mEq/L. Which prescription should the nurse anticipate?", "o": [["Restrict fluid intake", true, "In SIADH, the body retains water. Restricting free water lets the sodium concentration rise."], ["0.45% sodium chloride at 125 mL/hr", false, "Hypotonic fluid adds free water and worsens dilutional hyponatremia. It also risks cerebral swelling in a head injury."], ["Encourage oral fluids of 3 L/day", false, "Extra water worsens the dilution that SIADH already causes."], ["D5W at 100 mL/hr", false, "Once dextrose is metabolized, D5W acts as free water and further lowers sodium."]], "r": "", "tip": "In SIADH the problem is too much water, so restrict water rather than give it."}, {"id": "FE21", "u": "FE", "topic": "Potassium", "t": "single", "stem": "The nurse reviews potassium chloride prescriptions for a client with a potassium of 3.1 mEq/L. Which prescription should the nurse question?", "o": [["Potassium chloride 10 mEq IV push", true, "IV potassium is never given by push. A bolus can cause fatal dysrhythmias and cardiac arrest."], ["Potassium chloride 10 mEq in 100 mL over 1 hour via infusion pump", false, "Diluted, slow, and on a pump: the correct way to give IV potassium."], ["Potassium chloride 20 mEq orally with breakfast", false, "Oral is the preferred route. Giving it with food reduces GI irritation."], ["Recheck serum potassium after the replacement is complete", false, "Monitoring the response to replacement is appropriate."]], "r": "", "tip": "Safety: IV potassium is always diluted, always on a pump, and never given IV push."}, {"id": "FE23", "u": "FE", "topic": "Potassium", "t": "single", "stem": "A client with hyperkalemia received regular insulin 10 units IV with hypertonic dextrose. Which assessment is the nurse's priority over the next hour?", "o": [["Blood glucose", true, "Insulin moves glucose into cells along with potassium, so hypoglycemia is the main risk. Dextrose is given to offset it."], ["Serum sodium", false, "Sodium monitoring is the concern with Kayexalate, which exchanges sodium for potassium."], ["Deep tendon reflexes", false, "Reflex monitoring is the key assessment for magnesium therapy."], ["Urine specific gravity", false, "Not affected by the insulin and dextrose shift."]], "r": "", "tip": "Know each drug's specific risk: insulin means glucose, Kayexalate means sodium, magnesium means reflexes and respirations."}, {"id": "FE26", "u": "FE", "topic": "Potassium", "t": "single", "stem": "An asymptomatic client with a normal ECG has a potassium of 6.2 mEq/L. Potassium chloride is infusing in the left forearm, and the lab drew the sample from the left antecubital site. What should the nurse do first?", "o": [["Request a repeat sample drawn from the opposite arm", true, "A sample drawn above a KCl infusion is contaminated and falsely high. A result that doesn't fit the clinical picture should be verified before treatment."], ["Administer prescribed sodium polystyrene sulfonate", false, "Treating a likely false value could cause true hypokalemia."], ["Stop the infusion and notify the provider of hyperkalemia", false, "This acts on a value that has not been verified. Confirm it first."], ["Increase dietary potassium restrictions", false, "This acts on an unverified value and does not address the contaminated sample."]], "r": "", "tip": "Assess before intervening. Never draw labs from the arm with KCl infusing, and verify a result that doesn't match the client."}, {"id": "FE28", "u": "FE", "topic": "Potassium", "t": "single", "stem": "A client with chronic kidney disease has a potassium of 6.4 mEq/L. Which ECG change should the nurse expect?", "o": [["Tall, peaked T waves", true, "The earliest ECG sign of hyperkalemia. QRS widening and lost P waves follow as the level climbs."], ["Prominent U waves", false, "U waves are the signature of hypokalemia. Pairing U waves with high potassium is a common mix-up."], ["Depressed ST segments", false, "ST depression accompanies hypokalemia (low and slow), not hyperkalemia."], ["Prolonged QT interval", false, "QT prolongation is associated with hypocalcemia and hypomagnesemia rather than high potassium."]], "r": "", "tip": "High K: peaked T, wide QRS, lost P. Low K: flat T, U wave, ST depression."}, {"u": "FE", "topic": "Potassium", "t": "single", "stem": "A 73-year-old client taking furosemide is admitted with muscle weakness, fatigue, and leg cramps. Serum potassium is 2.9 mEq/L. Which additional finding should the nurse expect?", "o": [["Flattened T waves with prominent U waves", true, "Hypokalemia is “low and slow.” The T wave flattens, and the U wave is the signature ECG finding."], ["Tall, peaked T waves with a widened QRS", false, "Peaked T waves and QRS widening are the ECG pattern of hyperkalemia, the opposite imbalance."], ["Hyperactive bowel sounds with diarrhea", false, "Increased GI activity fits hyperkalemia. Low potassium slows smooth muscle, so bowel sounds are hypoactive and ileus can develop."], ["Hyperactive reflexes with muscle twitching", false, "Hyperreflexia and twitching fit hypomagnesemia or hypocalcemia. Hypokalemia decreases deep tendon reflexes."]], "r": "", "tip": "Loop diuretics waste potassium. Hypokalemia is low and slow: heart (flat T, U wave), gut (hypoactive, ileus), muscles (weak, decreased DTRs).", "id": "FE20c"}, {"id": "FE29", "u": "FE", "topic": "Calcium", "t": "single", "stem": "A 68-year-old client has been vomiting and has polyuria for 2 days. He reports dizziness and bone pain and is intermittently confused. His muscles are weak, bowel sounds are absent, and his last bowel movement was 5 days ago. Which imbalance should the nurse suspect?", "o": [["Hypercalcemia", true, "Bone pain is the hallmark: calcium is leached from bone into the blood. Polyuria, confusion, weakness, and constipation complete the picture. Malignancy is a common cause at this age."], ["Hypokalemia", false, "Hypokalemia also causes weakness and absent bowel sounds, but it does not cause bone pain."], ["Hypernatremia", false, "Hypernatremia can cause confusion and weakness, but expect thirst, fever, and a dry tongue rather than bone pain and ileus."], ["Hypomagnesemia", false, "Hypomagnesemia makes everything hyperactive: hyperreflexia and diarrhea, the opposite of this picture."]], "r": "", "tip": "Find the finding that only one answer explains. Here it is bone pain."}, {"id": "FE31", "u": "FE", "topic": "Calcium", "t": "single", "stem": "A client is 18 hours post-thyroidectomy and reports tingling around the mouth and in the fingertips. What should the nurse do first?", "o": [["Assess for Chvostek's and Trousseau's signs", true, "Perioral and fingertip paresthesias suggest hypocalcemia from parathyroid injury. Focused assessment confirms neuromuscular irritability before the nurse calls."], ["Notify the provider to request IV calcium gluconate", false, "This will likely follow, but the nurse gathers focused data first so the report is complete."], ["Encourage calcium-rich foods with the next meal", false, "Diet is too slow for acute post-surgical hypocalcemia."], ["Reassure the client that tingling is a residual effect of anesthesia", false, "This dismisses an early sign of a potentially dangerous complication (tetany, laryngospasm)."]], "r": "", "tip": "Assess before intervening. Paresthesias after neck surgery mean checking for calcium signs."}, {"id": "FE34", "u": "FE", "topic": "Calcium", "t": "single", "stem": "The nurse reviews morning labs. Which result should the nurse report as outside the normal reference range?", "o": [["Potassium 5.3 mEq/L", true, "Above 5.0. Hyperkalemia is a potassium greater than 5.0 mEq/L."], ["Sodium 136 mEq/L", false, "Within 135–145."], ["Calcium 9.0 mg/dL", false, "Within 8.8–10.5."], ["Magnesium 1.9 mg/dL", false, "Within 1.8–3.6."]], "r": "", "tip": "Know the boundaries: Na 135–145, K 3.5–5.0, Ca 8.8–10.5, Mg 1.8–3.6."}, {"u": "FE", "topic": "Calcium", "t": "single", "stem": "A client with bone metastases has a serum calcium of 12.4 mg/dL. Which intervention should the nurse include in the plan of care?", "o": [["Encourage weight-bearing activity such as walking", true, "Weight bearing keeps calcium in bone. Immobility increases bone resorption and raises serum calcium further."], ["Maintain bed rest to reduce the risk of fracture", false, "Bed rest seems protective with bone metastases, but immobility worsens hypercalcemia and increases clot risk."], ["Offer milk between meals to settle the stomach", false, "Dairy adds calcium. Nausea is a symptom of hypercalcemia, so milk worsens the cause while treating the symptom."], ["Limit oral fluids to 1.5 L/day to protect the kidneys", false, "Hypercalcemia calls for more fluid, 3–4 L/day orally plus IV 0.9% sodium chloride, to dilute calcium and promote excretion and prevent stones."]], "r": "", "tip": "Hypercalcemia: dilute and excrete (NS IV, 3–4 L/day PO, furosemide, calcitonin), keep moving, strain urine for stones, cut dairy.", "id": "FE30c"}, {"id": "FE36", "u": "FE", "topic": "Magnesium", "t": "single", "stem": "A 32-year-old with a long history of alcohol use arrives with an irregular pulse, confusion, tremors, and a carpal spasm during a blood pressure reading. Which imbalance should the nurse suspect?", "o": [["Hypomagnesemia", true, "Alcohol is the most common cause (poor intake, increased urinary loss, vomiting). Low magnesium makes nerves and muscles hyperexcitable and can cause torsades. Low magnesium often coexists with low calcium, which is why Trousseau's sign is positive."], ["Hypokalemia", false, "Hypokalemia causes dysrhythmias, but its muscles are weak and limp. It does not produce carpal spasm."], ["Hypercalcemia", false, "High calcium depresses neuromuscular activity. Tetany fits low calcium, not high."], ["Hypernatremia", false, "Hypernatremia can cause confusion and twitching, but it does not explain carpal spasm or the link to alcohol."]], "r": "", "tip": "Alcohol use disorder points to magnesium. A positive Trousseau's or Chvostek's sign means low calcium or low magnesium."}, {"id": "FE37", "u": "FE", "topic": "Magnesium", "t": "single", "stem": "A client receiving IV magnesium sulfate has a respiratory rate of 10/min and absent patellar reflexes. What should the nurse do first?", "o": [["Stop the magnesium infusion", true, "These are signs of magnesium toxicity. Stopping the source is the immediate step before anything else."], ["Administer IV calcium gluconate", false, "Calcium is the antidote, but it follows stopping the infusion and generally needs a prescription."], ["Notify the provider", false, "Necessary, but the nurse first stops the drug that is causing the respiratory depression."], ["Draw a serum magnesium level", false, "The clinical findings already show toxicity. Waiting for a lab delays the critical action."]], "r": "", "tip": "Remove the cause first. Stopping the infusion is within nursing scope and takes effect immediately."}, {"id": "FE41", "u": "FE", "topic": "CKD", "t": "single", "stem": "A client's GFR is 15 mL/min. The nurse recognizes this places the client in which stage of chronic kidney disease?", "o": [["Stage 4", true, "Stage 4 is a GFR of 15–29. Stage 5 starts below 15."], ["Stage 5", false, "Stage 5 (end-stage renal disease) is a GFR less than 15. A GFR of exactly 15 is still stage 4."], ["Stage 3", false, "Stage 3 is a GFR of 30–59."], ["Stage 2", false, "Stage 2 is a GFR of 60–89."]], "r": "", "tip": "The stage boundaries: ≥90, 60–89, 30–59, 15–29, below 15. Dialysis is considered below 15."}, {"id": "FE42", "u": "FE", "topic": "CKD", "t": "single", "stem": "A 64-year-old with diabetes and CKD has a GFR of 13 mL/min, Hgb 10.8 g/dL, and Hct 29%. Which medication addresses the underlying cause of her anemia?", "o": [["Epoetin alfa", true, "Failing kidneys produce too little erythropoietin, so red cell production falls. Epoetin replaces the missing hormone."], ["Oral ferrous sulfate", false, "Iron supports red cell production, but it does not replace the missing erythropoietin, which is the primary cause in CKD."], ["Cyanocobalamin (vitamin B12)", false, "B12 treats pernicious or megaloblastic anemia, not anemia from kidney failure."], ["Filgrastim", false, "Filgrastim stimulates white blood cells, not red blood cells."]], "r": "", "tip": "Anemia in CKD comes from too little erythropoietin."}, {"id": "FE44", "u": "FE", "topic": "CKD", "t": "single", "stem": "Which explains why a client with chronic kidney disease develops hypocalcemia?", "o": [["Retained phosphate lowers calcium, and vitamin D is not activated", true, "Calcium and phosphate are inversely related. Without calcitriol (active vitamin D), the gut absorbs less calcium. Parathyroid hormone then pulls calcium from bone, which causes weak bones."], ["Calcium is lost in the urine through the damaged glomerular filter", false, "Phosphate retention and vitamin D failure drive low calcium, not urinary calcium loss."], ["Diuretics prescribed for CKD fluid overload waste calcium in urine", false, "Loop diuretics can lower calcium, but they do not explain the CKD mechanism."], ["A low-protein renal diet supplies too little dietary calcium", false, "Diet restriction is not the mechanism. Dairy is limited for its phosphorus."]], "r": "", "tip": "Calcium and phosphate move in opposite directions."}, {"id": "FE46", "u": "FE", "topic": "CKD", "t": "single", "stem": "A client with diabetes asks how high blood sugar damages the kidneys. Which response is most accurate?", "o": [["“Hyperglycemia raises pressure inside the glomerular capillaries, and over time albumin leaks into the urine.”", true, "Hyperglycemia causes osmotic diuresis, compensatory growth, elevated glomerular pressure, and albumin leakage."], ["“High pressure in the vessels thickens and scars the capillary walls and causes small hemorrhages.”", false, "This describes hypertensive kidney damage (sclerosis and thickening)."], ["“An immune reaction inflames the glomeruli, and blood appears in the urine.”", false, "This describes nephritic disease (post-strep, Goodpasture's), where hematuria is the hallmark."], ["“Too little blood flow from dehydration starves the kidneys.”", false, "This describes a prerenal cause, not diabetic nephropathy."]], "r": "", "tip": "Diabetes means pressure and protein leak. Hypertension means sclerosis and scarring. Diabetes and hypertension together cause about 2/3 of CKD."}, {"id": "FE49", "u": "FE", "topic": "CKD", "t": "single", "stem": "A client with stage 3 CKD is reviewing prevention teaching. Which statement indicates a need for further teaching?", "o": [["“I'll take ibuprofen whenever my knee hurts.”", true, "NSAIDs are nephrotoxic. The client should check with the provider before taking any over-the-counter drug."], ["“I'll ask whether my CT really needs IV contrast, and drink extra fluids afterward if it does.”", false, "Correct. Contrast media is nephrotoxic, so weigh the need and flush afterward."], ["“My blood pressure goal is below 130/80.”", false, "Correct target for CKD."], ["“I'll check with my provider before starting any supplement or herb.”", false, "Correct. Many supplements are cleared by the kidneys or harm them."]], "r": "", "tip": "Protect the remaining nephrons. Avoid NSAIDs and contrast, and control BP and glucose."}, {"id": "FE51", "u": "FE", "topic": "CKD", "t": "single", "stem": "The nurse teaches a client with CKD to report weight gain. Which threshold should the nurse teach?", "o": [["5 lb in 2 days", true, "The standard CKD teaching. A sudden gain like this reflects fluid retention, not tissue."], ["1 lb in 2 days", false, "This range is normal day-to-day variation."], ["5 lb in 2 weeks", false, "A gain this gradual may be tissue rather than fluid, and it delays recognition of overload."], ["10 lb in 2 days", false, "Waiting for this much gain means the client is already significantly overloaded (about 4.5 L)."]], "r": "", "tip": "Weigh at the same time on the same scale. Report 5 lb in 2 days."}, {"id": "FE54", "u": "FE", "topic": "CKD", "t": "single", "stem": "A client asks what causes end-stage renal disease. After diabetes and hypertension, what is the third leading cause?", "o": [["Glomerular disease", true, "Diabetes and hypertension are as the leading causes, with glomerular disease third."], ["Polycystic kidney disease", false, "An inherited, non-modifiable risk factor, but not the third leading cause."], ["Nephrotoxic medications", false, "A modifiable risk factor (NSAIDs, contrast), but not one of the three leading causes."], ["Chronic urinary tract infection", false, "A risk factor, but not one of the three leading causes."]], "r": "", "tip": "The three major causes are diabetes, hypertension, and glomerular disease."}, {"id": "FE57", "u": "FE", "topic": "CKD", "t": "single", "stem": "While assessing a client with end-stage renal disease, the nurse auscultates a pericardial friction rub. Which complication does this suggest?", "o": [["Pericarditis from uremia", true, "A friction rub is a sign of pericarditis caused by acute uremia."], ["Fluid volume excess", false, "Overload produces an S3, crackles, and JVD rather than a friction rub."], ["Hyperkalemia", false, "High potassium shows up as ECG changes (peaked T waves), not a rub."], ["Anemia from low erythropoietin", false, "Anemia causes fatigue, pallor, and dizziness, not a rub."]], "r": "", "tip": "In ESRD, monitor heart and lung sounds every shift. A rub means uremic pericarditis."}, {"u": "FE", "topic": "CKD", "t": "single", "stem": "A client with stage 4 chronic kidney disease is taught about diet. Which statement by the client indicates correct understanding?", "o": [["“I’ll season my food with herbs instead of a salt substitute.”", true, "Salt substitutes are potassium chloride, which is dangerous when the kidneys cannot excrete potassium."], ["“I’ll switch to whole-grain bread and brown rice for fiber.”", false, "Whole grains are higher in potassium and phosphorus. CKD is the one time refined white bread and white rice are preferred."], ["“I’ll add more milk and cheese to help protect my bones.”", false, "Dairy is high in phosphorus, and retained phosphorus is what drives CKD bone disease."], ["“I’ll eat a banana each morning for steady energy.”", false, "Bananas, oranges, and orange juice are high in potassium. Apples and peaches are lower-potassium choices."]], "r": "", "tip": "CKD diet: low protein, high carbohydrate, about 2 g sodium, 1–2 L water, low potassium and phosphorus, no salt substitutes.", "id": "FE45c"}, {"id": "FE60", "u": "FE", "topic": "Dialysis", "t": "single", "stem": "At the start of the shift, the nurse cannot palpate a thrill or auscultate a bruit over a hospitalized client's AV fistula. What should the nurse do?", "o": [["Notify the provider promptly", true, "Loss of thrill and bruit means the access may be clotted. Fast intervention can save it."], ["Reassess in 4 hours", false, "Delay reduces the chance of saving a clotted access."], ["Apply a warm compress and reassess", false, "This is not a recognized intervention for a clotted access, and it delays reporting."], ["Document the finding for the dialysis team at the next run", false, "Waiting for the next run could cost the access entirely."]], "r": "", "tip": "Actual vs. potential: an absent thrill and bruit is an actual loss of a lifeline access. Report it now."}, {"id": "FE61", "u": "FE", "topic": "Dialysis", "t": "single", "stem": "A client on peritoneal dialysis reports abdominal pain and fever, and the effluent is cloudy. Which complication should the nurse suspect?", "o": [["Peritonitis", true, "The biggest complication of PD. Cloudy effluent is the key sign of infection."], ["Catheter migration", false, "Migration causes poor outflow, but not fever or cloudy effluent."], ["Hyperglycemia", false, "Dextrose dialysate can raise glucose, but it does not cause fever or cloudy effluent."], ["Constipation", false, "Constipation can impair drainage and cause discomfort, but it does not cause fever or cloudy effluent."]], "r": "", "tip": "Cloudy effluent means infection."}, {"id": "FE62", "u": "FE", "topic": "Dialysis", "t": "single", "stem": "A client returns from hemodialysis. Which finding requires the nurse's immediate follow-up?", "o": [["Blood soaking through the dressing at the needle site", true, "Heparin is used during dialysis, so bleeding from the access is the key post-run concern."], ["Report of feeling exhausted and wanting to rest", false, "Fatigue after a run is common and expected."], ["Leg cramps that began near the end of the run", false, "A common complaint from fluid and electrolyte shifts."], ["Report of feeling “blah” and wanting to sleep", false, "Malaise after dialysis is common and usually improves by the next day."]], "r": "", "tip": "Separate expected from unexpected. Fatigue, cramps, and malaise are expected. Bleeding is not."}, {"id": "FE67", "u": "FE", "topic": "Incontinence", "t": "single", "stem": "The provider suspects overflow incontinence in an older male client. Which test best confirms it?", "o": [["Postvoid residual measurement", true, "A large amount of urine left after voiding confirms incomplete emptying, the mechanism of overflow."], ["Urinary cough test while standing", false, "Used to identify stress incontinence (cough with a full bladder while standing)."], ["Three-day bladder diary", false, "Shows the pattern,
