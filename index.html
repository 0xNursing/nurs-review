 volume, and frequency of leakage, but does not measure retained urine."], ["Urinalysis with culture", false, "Screens for infection, glucose, and blood, but does not show retention."]], "r": "", "tip": "Match the test to the mechanism: retention means PVR, stress means the cough test."}, {"id": "FE69", "u": "FE", "topic": "Incontinence", "t": "single", "stem": "A 74-year-old with benign prostatic hyperplasia reports frequent dribbling of small amounts of urine. The nurse palpates a distended bladder. Which type of incontinence is most likely?", "o": [["Overflow", true, "The enlarged prostate obstructs the outlet. The bladder overdistends and leaks small amounts frequently."], ["Urge", false, "Outlet obstruction can cause detrusor overactivity, but a distended bladder with dribbling points to retention."], ["Stress", false, "Stress leakage occurs with coughing or lifting. The bladder is not distended."], ["Reflex", false, "Reflex incontinence follows neurologic injury and occurs at predictable volumes, not from obstruction."]], "r": "", "tip": "Distended bladder plus dribbling means overflow. Confirm with a postvoid residual."}, {"id": "FE70", "u": "FE", "topic": "Incontinence", "t": "single", "stem": "A client recovering from a stroke walks independently with a steady gait and is oriented. He says, “When I have to go, I can't hold it long enough to reach the bathroom.” Which type of incontinence does this describe?", "o": [["Urge", true, "Stroke can cause detrusor overactivity, with a sudden strong urge and leakage before reaching the toilet."], ["Functional", false, "Functional incontinence comes from inability to reach or recognize the toilet. This client walks steadily and is oriented."], ["Reflex", false, "Reflex incontinence occurs without awareness at predictable volumes. This client feels the urge."], ["Overflow", false, "Overflow presents as dribbling from a distended bladder, not a strong urge."]], "r": "", "tip": "Read the stem for what rules options out. Intact mobility and cognition make functional incontinence unlikely."}, {"id": "FE71", "u": "FE", "topic": "Incontinence", "t": "single", "stem": "A client with a T6 spinal cord injury voids involuntarily at fairly predictable intervals as the bladder fills, without sensing the need to void. Which type of incontinence is this?", "o": [["Reflex", true, "The injury disrupts brain control of the sacral micturition center, so the bladder empties reflexively at a set volume."], ["Overflow", false, "Overflow is linked with SCI below S2, where the detrusor cannot contract and the bladder overdistends."], ["Urge", false, "Urge incontinence involves a strong sensation of needing to void. This client has no sensation."], ["Functional", false, "The urinary tract and reflex arc are the problem here, not access to the toilet."]], "r": "", "tip": "SCI above the sacral cord means reflex. SCI below S2 means overflow."}, {"u": "FE", "topic": "Incontinence", "t": "single", "stem": "The nurse is screening clients at a community clinic. Which client has the greatest risk for urinary incontinence?", "o": [["A 70-year-old woman with obesity, diabetes, and chronic constipation", true, "Female sex, older age, obesity (abdominal pressure), diabetes (neuropathy, detrusor overactivity), and constipation (outlet obstruction) are all risk factors."], ["A 70-year-old man who exercises daily and eats a high-fiber diet", false, "Age is a risk, but male sex is lower risk, and exercise and fiber are prevention strategies."], ["A 45-year-old woman who smokes and has no other health conditions", false, "Smoking and female sex are risk factors, but she has fewer than the 70-year-old woman."], ["A 50-year-old man with controlled hypertension who walks daily", false, "He has no incontinence risk factors, and regular activity is protective."]], "r": "", "tip": "Risk: age, female, obesity, smoking, diabetes, inactivity, constipation, pregnancy, depression, neuro disorders, medications. Prevention reverses the modifiable ones.", "id": "FE73c"}, {"id": "FE74", "u": "FE", "topic": "UTI & BPH", "t": "single", "stem": "An 84-year-old resident in long-term care is newly confused and incontinent. Temperature is 99.1°F (37.3°C). What should the nurse do first?", "o": [["Compare the resident's current vital signs and mental status with baseline", true, "Older adults often lack typical UTI or sepsis symptoms. New confusion or incontinence may be the only sign. Establish the change from baseline first."], ["Obtain a urine specimen for culture", false, "Likely needed, but the nurse first assesses and confirms the change so the report is complete."], ["Notify the provider that the resident's dementia is progressing", false, "This assumes chronic decline when an acute cause, such as delirium from a UTI, has not been ruled out."], ["Begin a 2-hour toileting schedule", false, "This treats the incontinence without investigating its acute cause."]], "r": "", "tip": "Assess first, and think atypical: an acute change in an older adult means infection until proven otherwise."}, {"id": "FE77", "u": "FE", "topic": "UTI & BPH", "t": "single", "stem": "A client with benign prostatic hyperplasia asks about taking diphenhydramine to help him sleep. How should the nurse respond?", "o": [["“It can cause urinary retention by making your bladder harder to empty.”", true, "Anticholinergic drugs weaken detrusor contraction. Combined with BPH's outlet obstruction, they can cause acute retention and overflow incontinence."], ["“It's safe for you because it does not affect the bladder or prostate.”", false, "Diphenhydramine has strong anticholinergic effects."], ["“Its main side effect is drowsiness, which will help you sleep.”", false, "This ignores the urinary retention risk."], ["“It may increase how much urine your kidneys make overnight.”", false, "It causes retention, not increased urine production."]], "r": "", "tip": "BPH plus an anticholinergic leads to retention and overflow."}, {"id": "FE79", "u": "FE", "topic": "UTI & BPH", "t": "single", "stem": "A client is hospitalized with a urinary tract infection. Which IV fluid goal should the nurse anticipate?", "o": [["3 to 4 L/day", true, "The hospital UTI plan: I&O, IV fluids of 3–4 L/day, VS, antibiotics, and antipyretics."], ["1,000 to 1,500 mL/day", false, "This is the fluid restriction range for fluid volume excess."], ["1 to 2 L/day", false, "This is the CKD water limit."], ["5 to 6 L/day", false, "More than the goal, with a risk of overload."]], "r": "", "tip": "Know which number belongs to which topic. 3–4 L applies to both UTI and hypercalcemia."}, {"u": "FE", "topic": "UTI & BPH", "t": "single", "stem": "A 22-year-old with recurrent urinary tract infections reports that she does not void after intercourse. Which instruction should the nurse include?", "o": [["Urinate soon after intercourse to flush the urethra", true, "Voiding flushes out bacteria introduced into the urethra during intercourse."], ["Take tub baths instead of showers to clean the perineum", false, "Showers are preferred. Sitting in bathwater increases bacterial exposure at the urethral opening."], ["Drink orange juice daily to make the urine more acidic", false, "Citrus is a bladder irritant along with coffee, tea, colas, spices, and alcohol."], ["Hold urine longer during the day to train the bladder", false, "Delaying voiding causes urinary stasis, which promotes bacterial growth."]], "r": "", "tip": "UTI prevention: void after intercourse, wipe front to back, shower, increase fluids, avoid bladder irritants.", "id": "FE75c"}, {"id": "TI6", "u": "TI", "topic": "PAD", "t": "sata", "stem": "Which assessment findings should the nurse expect in a client with peripheral arterial disease? Select all that apply.", "o": [["Rubor when the legs are dependent", true, "Dependent rubor: the legs turn red below the heart as maximally dilated vessels fill by gravity."], ["Pallor when the legs are elevated", true, "Elevation pallor: without gravity assisting, the narrowed arteries can't perfuse the limb, so it blanches."], ["Sparse hair growth on the lower legs", true, "Reduced blood flow and nutrient delivery can no longer support hair follicles."], ["Delayed capillary refill in the toes", true, "Reduced arterial inflow slows refill."], ["Diminished or absent pedal pulses", true, "Narrowed arteries reduce pulse amplitude distal to the obstruction."], ["Red-brown discoloration around the ankles", false, "Hemosiderin staining comes from red blood cell breakdown in pooled venous blood. It is a CVI finding."], ["Leg pain that improves with elevation", false, "Elevation relieves venous congestion. In PAD, elevation reduces arterial flow and worsens ischemic pain."]], "r": "", "tip": "Think about what reduced arterial flow does to the limb: color, temperature, pulses, cap refill, hair, sensation, and pain."}, {"id": "TI18", "u": "TI", "topic": "CVI", "t": "sata", "stem": "Which findings should the nurse expect in a client with chronic venous insufficiency? Select all that apply.", "o": [["Lower-leg edema", true, "Blood pools in the legs when valves fail, and fluid moves into the tissue."], ["Red, purplish-brown discoloration of the lower leg", true, "Hemosiderin staining comes from the breakdown of red blood cells that leak from congested veins."], ["Itchy, scaly dermatitis of the lower legs", true, "Venous stasis dermatitis (eczema with itching) is a classic CVI finding."], ["Varicose veins", true, "Dilated superficial veins result from valve failure and venous hypertension."], ["Leg pain that is worse at the end of the day", true, "Pain worsens with dependency, so being on the feet all day makes it worse by evening."], ["Pallor of the foot when the leg is elevated", false, "Elevation pallor is an arterial finding. In CVI, elevation relieves symptoms."], ["Thin, shiny, hairless skin with absent pedal pulses", false, "These reflect chronic arterial insufficiency."]], "r": "", "tip": "Venous = congestion: edema, staining, dermatitis, varicosities, pain worse when dependent."}, {"id": "TI86", "u": "TI", "topic": "Pressure injury", "t": "sata", "stem": "The nurse is assessing for a stage 1 pressure injury in a client with darkly pigmented skin. Which techniques are recommended? Select all that apply.", "o": [["Moisten the skin before inspecting", true, "From the NPIAP tips for staging darkly pigmented skin."], ["Inspect for changes in pigmentation compared with the surrounding skin", true, "Redness may not be visible. Look for a color that differs from the surrounding skin, often purplish or bluish."], ["Palpate for edema, firmness, and temperature change", true, "Warmth, then coolness, and firm or boggy tissue are early cues."], ["Ask the client about pain or itching in the area", true, "Pain and altered sensation can precede visible change."], ["Use a bright light shone directly on the skin", false, "NPIAP guidance is to avoid direct light, which washes out subtle color changes."], ["Rely on whether the area blanches as the main sign", false, "Darkly pigmented skin may not show visible blanching, so blanching alone misses stage 1 injuries."]], "r": "", "tip": "Dark skin: moisten, compare color, palpate, ask, avoid direct light."}, {"id": "TI47", "u": "TI", "topic": "Complications", "t": "sata", "stem": "Which client factors would impair wound healing? Select all that apply.", "o": [["Prednisone 20 mg daily", true, "Corticosteroids depress granulation tissue formation and inhibit fibroblast proliferation."], ["Blood glucose of 212 mg/dL", true, "Glucose above the 80–130 target slows healing."], ["Pain rated 8/10 that is not controlled", true, "Uncontrolled pain causes vasoconstriction and releases pro-inflammatory cytokines."], ["Current tobacco use", true, "Smoking constricts vessels and reduces oxygen delivery."], ["BMI of 41", true, "Obesity decreases blood supply in fatty tissue and raises the risk of dehiscence."], ["Blood glucose of 118 mg/dL", false, "This is within the 80–130 target."], ["Hemoglobin of 14.2 g/dL", false, "A normal hemoglobin supports oxygen delivery. Anemia, not this value, impairs healing."]], "r": "", "tip": "Healing needs blood flow, oxygen, nutrients, immune function, and glucose control."}, {"id": "TI2", "u": "TI", "topic": "PAD", "t": "single", "stem": "ABI readings: right brachial 142 mm Hg, left brachial 136 mm Hg, right dorsalis pedis 104 mm Hg, right posterior tibial 110 mm Hg. What is the right-leg ABI?", "o": [["0.77", true, "Highest right ankle pressure (110) divided by the highest brachial pressure (142) = 0.77."], ["0.81", false, "This divides 110 by the lower brachial pressure (136). The denominator must be the higher of the two arms."], ["0.73", false, "This uses the lower ankle pressure (104 ÷ 142). The numerator is the higher ankle pressure."], ["0.76", false, "This divides the lower ankle pressure by the lower brachial pressure (104 ÷ 136), so both values are wrong."]], "r": "", "tip": "Highest ankle ÷ highest brachial. Using either lower value inflates or deflates the ratio."}, {"id": "TI4", "u": "TI", "topic": "PAD", "t": "single", "stem": "A client's ABI is 0.92. How should the nurse interpret this result?", "o": [["Borderline", true, "0.91–0.99 is borderline. It is below the normal range of 1.0–1.4 but above the ≤0.9 abnormal cutoff."], ["Normal", false, "The normal range starts at 1.0. A value under 1.0 means ankle pressure is lower than arm pressure."], ["Abnormal, consistent with intermittent claudication", false, "Abnormal begins at 0.9 or below. 0.92 sits just above that cutoff."], ["Abnormal, consistent with rest pain", false, "Rest pain corresponds to an ABI below 0.5."]], "r": "", "tip": "Watch the cutoffs: 0.9 is abnormal, 0.91 is borderline."}, {"id": "TI8", "u": "TI", "topic": "PAD", "t": "single", "stem": "A client with peripheral arterial disease asks how to exercise when walking causes calf pain. Which instruction is best?", "o": [["Walk until discomfort starts, rest, then resume walking", true, "This is the recommended walking program. Exercise is still important in claudication and promotes collateral circulation."], ["Stop walking for the day once the calf pain begins", false, "Stopping for the day limits the exercise that builds collateral circulation. The client should rest briefly and resume."], ["Keep walking through the pain to build collateral vessels", false, "Pushing through ischemic pain is not the recommendation. The client rests until the pain eases, then walks again."], ["Avoid walking and use leg exercises while lying in bed", false, "Walking is the recommended exercise. Avoiding it accelerates deconditioning."]], "r": "", "tip": "Walk to discomfort, rest, repeat."}, {"id": "TI10", "u": "TI", "topic": "PAD", "t": "single", "stem": "A client with PAD has an arterial ulcer on the tip of the great toe covered with dry, stable black eschar. Which action is appropriate?", "o": [["Keep the eschar intact and dry", true, "Stable eschar on an ischemic limb is a protective cover. Removing it exposes the wound to organisms that poor blood flow cannot fight."], ["Request sharp debridement of the eschar", false, "Debridement opens the wound in a limb without enough perfusion to heal or resist infection."], ["Apply a hydrocolloid to soften the eschar", false, "Hydrocolloids are not used on arterial ulcers. Anaerobic bacteria can grow under the occlusive dressing."], ["Apply a wet-to-dry dressing to remove the eschar", false, "Wet-to-dry is nonselective mechanical debridement. It would remove the protective cover."]], "r": "", "tip": "Stable eschar on an ischemic limb or heel stays on."}, {"id": "TI14", "u": "TI", "topic": "PAD", "t": "single", "stem": "Which new report from a client with known PAD should concern the nurse most for disease progression?", "o": [["Foot pain that wakes the client at night", true, "Nocturnal and rest pain appear as PAD progresses and correspond to an ABI below 0.5. Perfusion no longer meets demand even at rest."], ["Calf pain after walking four blocks", false, "Stable claudication is the expected baseline symptom of PAD."], ["Feet that feel cool in an air-conditioned room", false, "Ischemic limbs are more sensitive to cold. Warm socks are appropriate, and this does not signal progression."], ["Sparse hair growth on both shins", false, "This is a chronic finding of reduced perfusion, not a new change."]], "r": "", "tip": "Claudication → rest pain → nocturnal pain → tissue loss. Pain without exertion means worse disease."}, {"id": "TI16", "u": "TI", "topic": "PAD", "t": "single", "stem": "A client has an ABI of 0.62 and a pale, nonhealing toe ulcer. Which nursing problem is the priority?", "o": [["Ineffective peripheral tissue perfusion", true, "The root problem is reduced arterial flow. Perfusion determines whether the ulcer can heal or resist infection."], ["Impaired skin integrity of the toe", false, "The ulcer is real, but it is a consequence of the perfusion deficit. Treating the skin alone won't heal it."], ["Activity intolerance related to claudication", false, "Claudication may limit activity, but that is secondary to ischemia."], ["Risk for falls related to paresthesia", false, "Not indicated by the data given, and a risk problem ranks below an actual perfusion problem."]], "r": "", "tip": "Address the cause: a perfusion problem drives an arterial wound."}, {"id": "TI112", "u": "TI", "topic": "PAD", "t": "single", "stem": "A client returns from femoral-popliteal bypass surgery. Which assessment should the nurse perform on the first postoperative day?", "o": [["Check pulses in the affected leg every 15 minutes", true, "The priority is circulation through the graft. Pulses, color, temperature, cap refill, and sensation are checked every 15 minutes, then less often if stable."], ["Palpate the affected leg for pain at each assessment", false, "Pain is assessed regularly, but palpation isn't the preferred method and doesn't evaluate graft flow."], ["Check for compartment syndrome every 2 hours", false, "Compartment syndrome is more associated with casts than with bypass surgery."], ["Perform a Doppler evaluation of the graft once daily", false, "Once a day is too infrequent. Doppler checks are done every 2 hours."]], "r": "", "tip": "After revascularization: perfusion checks every 15 minutes, compared with the other leg."}, {"id": "TI17", "u": "TI", "topic": "CVI", "t": "single", "stem": "A client with chronic venous insufficiency has a prescription for compression wraps. What should the nurse do first?", "o": [["Assess the client for peripheral arterial disease", true, "Compression is contraindicated in PAD, and some clients have both. Always assess for PAD before applying compression."], ["Measure the client's calf circumference for sizing", false, "Sizing is appropriate, but only after it's been confirmed compression is safe."], ["Elevate the legs for 20 minutes to reduce edema", false, "Elevation helps before wrapping, but it doesn't address the safety question of arterial flow."], ["Apply a moisture barrier to the periwound skin", false, "Protecting the periwound is part of venous ulcer care, but it is not the safety check that comes first."]], "r": "", "tip": "Safety before intervention: rule out PAD (ABI) before any compression."}, {"id": "TI19", "u": "TI", "topic": "CVI", "t": "single", "stem": "Where should the nurse expect to find the classic venous leg ulcer?", "o": [["Over the medial malleolus", true, "The bony bump on the inner ankle is the classic venous ulcer site."], ["On the tips of the toes", false, "Toe tips and foot pressure points are classic arterial ulcer sites."], ["On the plantar surface of the forefoot", false, "The plantar aspect is the classic neuropathic ulcer site."], ["Over the posterior heel", false, "The heel is a common pressure injury site in clients who are immobile."]], "r": "", "tip": "Venous = medial malleolus. Arterial = toe tips. Neuropathic = plantar. Pressure = bony prominence."}, {"id": "TI21", "u": "TI", "topic": "CVI", "t": "single", "stem": "Which positioning instruction is appropriate for a client with chronic venous insufficiency?", "o": [["Elevate your legs above the level of your heart when resting", true, "Elevation uses gravity to assist venous return and reduce edema and pain."], ["Keep your legs dependent to improve circulation to your feet", false, "Dependency worsens venous pooling. That instruction fits PAD, not CVI."], ["Sit with your legs crossed to support the veins", false, "Crossing the legs compresses veins and impedes return."], ["Stand in place for long periods instead of sitting", false, "Both prolonged sitting and prolonged standing should be avoided. Walking is what helps."]], "r": "", "tip": "Venous: elevate, compress, walk, and avoid prolonged sitting or standing."}, {"id": "TI23", "u": "TI", "topic": "CVI", "t": "single", "stem": "Which diagnostic test for venous disease is performed by drawing a blood sample?", "o": [["D-dimer", true, "D-dimer is a blood test that detects byproducts of activated coagulation, which suggests a thromboembolic event."], ["Venography", false, "Venography is an imaging study using contrast to visualize the veins."], ["Ultrasonography", false, "Duplex ultrasound is noninvasive imaging of the veins."], ["Ankle-brachial index", false, "ABI is a bedside Doppler pressure ratio for arterial disease."]], "r": "", "tip": "CVI diagnostics: ultrasonography, venography, D-dimer."}, {"id": "TI29", "u": "TI", "topic": "Ulcer comparison", "t": "single", "stem": "A client has a venous ulcer and an ABI of 0.68. The provider prescribes high-compression wraps. What should the nurse do?", "o": [["Clarify the prescription before applying the wraps", true, "An ABI of 0.68 confirms PAD. High compression could further compromise arterial flow, so the type of compression must be reconsidered."], ["Apply the wraps and check pedal pulses every 4 hours", false, "Monitoring after applying an unsafe intervention doesn't prevent harm."], ["Apply the wraps loosely to reduce the pressure", false, "Altering the prescription on the nurse's own judgment isn't appropriate, and loose wraps don't resolve the arterial risk."], ["Elevate the legs instead and document the refusal", false, "Elevation can worsen arterial perfusion, and the nurse should communicate with the provider rather than substitute an intervention."]], "r": "", "tip": "Clients can have both. PAD changes whether, and what type of, compression is safe."}, {"id": "TI31", "u": "TI", "topic": "Ulcer comparison", "t": "single", "stem": "While assessing a plantar neuropathic ulcer, the nurse can advance a sterile probe all the way to bone. What does the nurse suspect?", "o": [["Osteomyelitis", true, "Probing to bone strongly suggests the infection has reached the bone. Osteomyelitis is very hard to treat."], ["A stage 4 pressure injury", false, "Staging applies only to pressure injuries. This is a neuropathic ulcer, even though bone is reachable."], ["Normal depth for a chronic plantar ulcer", false, "Bone exposure is never an expected finding."], ["A deep tissue pressure injury", false, "DTI is intact or nonintact discolored skin from pressure and shear, not an open plantar ulcer."]], "r": "", "tip": "Probe to bone means osteomyelitis until proven otherwise."}, {"id": "TI32", "u": "TI", "topic": "Ulcer comparison", "t": "single", "stem": "What is the major treatment for healing a neuropathic plantar ulcer?", "o": [["Offloading pressure from the wound", true, "Offloading (special shoes, padding, knee scooter, total contact casting) removes the force that created and maintains the ulcer."], ["Applying compression wraps to the leg", false, "Compression treats venous disease and could worsen arterial flow, which is often also impaired in diabetes."], ["Elevating the foot above the heart", false, "Elevation treats venous congestion and doesn't remove plantar pressure."], ["Applying a hydrocolloid dressing", false, "Avoid hydrocolloids on these wounds because anaerobes can grow underneath."]], "r": "", "tip": "Address the cause: pressure caused it, so offloading heals it."}, {"id": "TI36", "u": "TI", "topic": "Healing phases", "t": "single", "stem": "A contaminated traumatic wound is left open for 5 days until the infection clears, and is then sutured closed. What type of healing is this?", "o": [["Tertiary intention", true, "Also called delayed primary. It starts like secondary intention, then is closed like primary once contamination, edema, or foreign material is resolved."], ["Primary intention", false, "Primary intention means the edges are closed at the outset."], ["Secondary intention", false, "Secondary-intention wounds are never surgically closed; they fill in from the base."], ["Delayed secondary intention", false, "Not a recognized category. Delayed closure is tertiary (delayed primary)."]], "r": "", "tip": "Tertiary: open first, closed later."}, {"id": "TI42", "u": "TI", "topic": "Healing phases", "t": "single", "stem": "On postoperative day 2, a client's incision edges are mildly red, warm, and slightly swollen. There is no drainage and the client is afebrile. How should the nurse interpret this?", "o": [["An expected inflammatory response", true, "Edema, erythema, pain, and warmth are normal during the inflammatory phase, which lasts up to 6–7 days."], ["An early surgical-site infection", false, "Infection after surgery typically appears around days 3–5 with purulent or malodorous drainage, fever, or increasing pain. None are present."], ["Early wound dehiscence", false, "Dehiscence is separation of the wound layers, usually around days 5–8."], ["A developing hypertrophic scar", false, "Hypertrophic scarring develops during remodeling, weeks later."]], "r": "", "tip": "Expected vs. unexpected: mild localized inflammation early on is normal healing."}, {"id": "TI43", "u": "TI", "topic": "Healing phases", "t": "single", "stem": "A client asks whether a healed surgical scar will be as strong as the original skin. Which response is accurate?", "o": [["“It will regain about 80% of the original strength.”", true, "Normal healing regains about 80% of the original tensile strength. Scar tissue is never as strong as undamaged tissue."], ["“It will be fully as strong once remodeling ends.”", false, "Scar tissue never reaches 100% of the original strength."], ["“It will regain about 50% of the original strength.”", false, "This underestimates the expected figure."], ["“It will be stronger than the skin around it.”", false, "Scar tissue is weaker, not stronger, than original tissue."]], "r": "", "tip": "Scar = about 80% tensile strength, never 100%."}, {"id": "TI45", "u": "TI", "topic": "Healing phases", "t": "single", "stem": "A wound bed is filled with beefy red granulation tissue. Which nursing consideration is most important?", "o": [["The tissue is friable, so handle it gently", true, "Granulation tissue is fragile, bleeds easily, and is easily damaged."], ["The color suggests infection, so obtain a culture", false, "Beefy red granulation is a healthy sign of proliferation, not infection."], ["The tissue is nonviable, so request debridement of it", false, "Granulation tissue is viable. Debridement targets necrotic or infected tissue."], ["The tissue is fully mature, so stop protecting the wound", false, "Granulation tissue is provisional. The wound still needs protection."]], "r": "", "tip": "Granulation is healthy and fragile: protect it."}, {"id": "TI48", "u": "TI", "topic": "Complications", "t": "single", "stem": "What blood glucose range is the target to support wound healing?", "o": [["80–130 mg/dL", true, "The target is 80–130. Higher levels slow healing."], ["70–110 mg/dL", false, "A plausible fasting range, but not the wound-healing target."], ["100–180 mg/dL", false, "The upper end exceeds the ceiling of 130."], ["140–180 mg/dL", false, "This entire range is above the target."]], "r": "", "tip": "Glucose target for healing: 80–130."}, {"id": "TI51", "u": "TI", "topic": "Complications", "t": "single", "stem": "On postoperative day 6, a client coughs, feels “something give,” and the nurse sees the incision partially separated with pink drainage. No organs are visible. What is this?", "o": [["Dehiscence", true, "Separation of one or more wound layers without protruding organs. It most often occurs around days 5–8 after surgery."], ["Evisceration", false, "Evisceration is complete separation with internal viscera protruding through the incision."], ["Fistula formation", false, "A fistula is an abnormal passage between two cavities or between a cavity and the skin, usually from infection."], ["Adhesion formation", false, "Adhesions are internal bands of scar tissue that cause pain or restricted movement."]], "r": "", "tip": "Dehiscence = layers separate. Evisceration = organs protrude."}, {"id": "TI54", "u": "TI", "topic": "Complications", "t": "single", "stem": "Four hours after surgery, which finding most suggests internal hemorrhage at the surgical site?", "o": [["HR rising from 82 to 118 and BP falling from 128/76 to 96/58", true, "Tachycardia with falling blood pressure signals hypovolemia from bleeding."], ["Small amount of serosanguineous drainage on the dressing", false, "A small amount of serosanguineous drainage is expected early after surgery."], ["Incision edges slightly red and warm to the touch", false, "Mild redness and warmth are part of the expected inflammatory response."], ["Pain rated 5/10 at the incision site", false, "Moderate incisional pain is expected and should be managed, but it is not a sign of hemorrhage."]], "r": "", "tip": "Vital signs reveal bleeding you can't see."}, {"id": "TI55", "u": "TI", "topic": "Complications", "t": "single", "stem": "When is dehiscence most likely after surgery?", "o": [["Days 5 to 8", true, "Dehiscence typically occurs around days 5–8, before enough collagen has been deposited to strengthen the wound."], ["Days 1 to 2", false, "This is the hemorrhage window."], ["Days 3 to 5", false, "This is the typical postoperative infection window."], ["Days 10 to 14", false, "By this point, collagen deposition has strengthened the wound."]], "r": "", "tip": "Dehiscence: days 5–8. Causes: poor nutrition, inadequate closure, infection."}, {"id": "TI57", "u": "TI", "topic": "Complications", "t": "single", "stem": "Which client is at greatest risk for wound dehiscence?", "o": [["A client with poor nutritional status and a wound infection", true, "Poor nutrition, inadequate closure, and infection are the most common causes of dehiscence."], ["A client with well-controlled diabetes and normal albumin", false, "Controlled glucose and adequate protein status support healing."], ["A client who is 2 hours post-op with an approximated incision", false, "Dehiscence is most likely on days 5–8, not in the first hours."], ["A client with a healed incision now in remodeling", false, "Remodeling has already deposited collagen. The risk is earlier."]], "r": "", "tip": "Dehiscence risk: poor nutrition, infection, inadequate closure, and obesity."}, {"u": "TI", "topic": "Complications", "t": "single", "stem": "On postoperative day 6, a client’s abdominal incision opens and loops of bowel protrude. What is the nurse’s first action?", "o": [["Stay with the client and call for help", true, "The nurse never leaves an eviscerated client. Calling for help brings supplies and gets the surgeon notified while the nurse protects the organs."], ["Cover the bowel with sterile saline-soaked dressings", false, "This is the next step, and an essential one, but the nurse summons help first rather than leaving to get supplies."], ["Notify the surgeon of the wound evisceration", false, "Evisceration needs surgical repair, but leaving the bedside to call delays protecting the exposed bowel."], ["Prepare the client for a return to surgery", false, "Surgical repair is the definitive treatment and comes last, after the organs are protected and the surgeon is notified."]], "r": "", "tip": "Evisceration order: stay and call for help → cover with sterile saline-soaked dressings → notify the surgeon → prepare for surgery. Dehiscence peaks days 5–8.", "id": "TI52c"}, {"id": "TI59", "u": "TI", "topic": "Nutrition & assessment", "t": "single", "stem": "A client with a stage 4 pressure injury weighs 70 kg. What daily calorie range is recommended to support healing?", "o": [["2,100–2,450 kcal/day", true, "30–35 kcal/kg/day × 70 kg = 2,100–2,450."], ["1,750–2,100 kcal/day", false, "This uses 25–30 kcal/kg, which is below the guideline of 30–35 kcal/kg."], ["2,450–2,800 kcal/day", false, "This uses 35–40 kcal/kg, which is above the guideline of 30–35 kcal/kg."], ["1,400–1,750 kcal/day", false, "This uses 20–25 kcal/kg and would underfeed a healing wound."]], "r": "", "tip": "Calories: 30–35 kcal/kg/day."}, {"id": "TI60", "u": "TI", "topic": "Nutrition & assessment", "t": "single", "stem": "A client with a chronic wound weighs 80 kg. What daily protein range is recommended to support healing?", "o": [["100–120 g/day", true, "1.25–1.5 g/kg/day × 80 kg = 100–120 g."], ["64–80 g/day", false, "This uses 0.8–1.0 g/kg, the general adult requirement, which is too low for wound healing."], ["80–100 g/day", false, "This uses 1.0–1.25 g/kg, below the recommended 1.25–1.5 g/kg."], ["120–140 g/day", false, "This uses 1.5–1.75 g/kg, above the recommended 1.25–1.5 g/kg."]], "r": "", "tip": "Protein: 1.25–1.5 g/kg/day."}, {"id": "TI64", "u": "TI", "topic": "Nutrition & assessment", "t": "single", "stem": "A sacral wound has a tunnel that extends 3 cm toward the client's head. How should the nurse document it?", "o": [["3 cm tunneling at 12 o'clock", true, "The head is always 12 o'clock and the feet are 6 o'clock."], ["3 cm tunneling at 6 o'clock", false, "6 o'clock points toward the feet."], ["3 cm tunneling at 3 o'clock", false, "3 o'clock is lateral, not toward the head."], ["3 cm undermining at 12 o'clock", false, "Undermining is the wound edge separating from the bed around the rim. A single track is tunneling."]], "r": "", "tip": "Clock method: head = 12, feet = 6. Document length and position."}, {"id": "TI70", "u": "TI", "topic": "Dressings & skin tears", "t": "single", "stem": "A client in long-term care has a sacral pressure injury. What is the first principle of wound intervention?", "o": [["Address the cause of the wound", true, "If pressure isn't relieved, no dressing will heal a pressure injury. Find and fix the cause first."], ["Select an advanced dressing for the wound", false, "Dressings matter, but they won't overcome ongoing pressure."], ["Obtain a wound culture before treatment", false, "Cultures are indicated when infection is suspected, not as the first universal step."], ["Debride all slough from the wound bed", false, "Debridement is one tool. It doesn't remove the cause."]], "r": "", "tip": "Address the cause!"}, {"id": "TI73", "u": "TI", "topic": "Dressings & skin tears", "t": "single", "stem": "Why are wet-to-dry dressings used much less often today?", "o": [["They remove healthy tissue along with necrotic tissue", true, "Dried gauze adheres to everything. Nonselective removal damages the wound bed and delays healing."], ["They add too much moisture to the wound bed", false, "They are allowed to dry, and removal is the problem."], ["They are more expensive than advanced dressings", false, "Gauze is inexpensive. Cost isn't the reason."], ["They seal the wound and promote anaerobic growth", false, "That concern applies to occlusive hydrocolloids, not gauze."]], "r": "", "tip": "Wet-to-dry is nonselective."}, {"id": "TI80", "u": "TI", "topic": "Pressure injury", "t": "single", "stem": "After the nurse repositions a client, reddened skin remains over the sacrum. Which finding confirms a stage 1 pressure injury?", "o": [["The discoloration remains at least 30 minutes after pressure is relieved", true, "Stage 1 is non-blanchable redness lasting 30 seconds or more, with discoloration remaining at least 30 minutes after pressure is relieved."], ["The discoloration remains at least 15 minutes after pressure is relieved", false, "This is shorter than the 30-minute threshold."], ["The discoloration remains at least 60 minutes after pressure is relieved", false, "Waiting for 60 minutes would delay recognition. The threshold is 30."], ["The discoloration fades within 30 seconds after pressure is relieved", false, "Redness that resolves quickly is blanchable, which isn't stage 1."]], "r": "", "tip": "Stage 1: non-blanchable over 30 seconds, persisting at least 30 minutes after offloading."}, {"id": "TI82", "u": "TI", "topic": "Pressure injury", "t": "single", "stem": "A client has a heel pressure injury covered with dry, adherent, intact eschar. There is no surrounding redness or fluctuance. What should the nurse do?", "o": [["Leave the eschar intact and offload the heel", true, "Stable eschar on the heel serves as the body's natural cover. NPIAP guidance is not to soften or remove it."], ["Request debridement so the wound can be staged", false, "Removing eschar is how most unstageable wounds get staged, but the heel is the exception."], ["Apply a hydrocolloid to soften the eschar", false, "Softening stable heel eschar is specifically not recommended."], ["Document it as a stage 4 pressure injury", false, "The base can't be seen, so it's unstageable. Assuming a stage isn't accurate documentation."]], "r": "", "tip": "Stable heel eschar stays on. It's documented as unstageable."}, {"id": "TI85", "u": "TI", "topic": "Pressure injury", "t": "single", "stem": "A pressure injury on the bridge of the nose from an oxygen mask is shallow, yet the nurse sees full-thickness tissue loss. Which statement explains why it is shallow?", "o": [["The bridge of the nose has no subcutaneous tissue", true, "Stage 3 and 4 depth varies by location. The nose, ear, occiput, and malleolus have no subcutaneous tissue, so these wounds can be shallow."], ["Device-related injuries are always staged as stage 2", false, "Device-related injuries are staged with the same system by depth."], ["Shallow wounds on the face are classified as unstageable", false, "Unstageable means the base is obscured by slough or eschar, not that it is shallow."], ["Facial skin heals faster, so it never reaches full thickness", false, "Full-thickness loss can occur anywhere."]], "r": "", "tip": "Depth varies by anatomy: thin areas give shallow stage 3/4 wounds; areas with more adiposity can be very deep."}, {"id": "TI87", "u": "TI", "topic": "Pressure injury", "t": "single", "stem": "Which finding over the sacrum of a client with dark skin should the nurse recognize as a possible stage 1 pressure injury?", "o": [["An area warmer than the surrounding skin that feels firm", true, "Temperature change and a change in tissue consistency are key cues when redness isn't visible."], ["An area the same color and temperature as the surrounding skin", false, "No difference from the surrounding tissue doesn't suggest injury."], ["An area that blanches briefly when pressed", false, "Blanching suggests no stage 1, and blanching may not be visible in dark skin anyway."], ["An area with an open, shallow, pink wound bed", false, "An open wound is at least stage 2."]], "r": "", "tip": "Without visible redness, use touch and compare with the surrounding tissue."}, {"id": "TI89", "u": "TI", "topic": "Pressure injury", "t": "single", "stem": "The nurse is completing a Braden assessment and cannot decide between scoring mobility as 3 (slightly limited) or 2 (very limited). What should the nurse do?", "o": [["Score mobility as 2", true, "When in doubt, score lower. A lower score means higher risk, so prevention measures are put in place."], ["Score mobility as 3", false, "Scoring higher may leave a high-risk client without interventions."], ["Average the two and enter 2.5", false, "Braden subscales use whole numbers."], ["Skip the subscale until the next shift", false, "An incomplete assessment delays risk identification."]], "r": "", "tip": "Braden: when unsure, score lower (higher risk)."}, {"id": "TI92", "u": "TI", "topic": "Pressure injury", "t": "single", "stem": "A client sitting in high Fowler's position keeps sliding down in bed. Which force is damaging the sacral tissue?", "o": [["Shear", true, "The skin stays put while the skeleton slides, stretching and tearing the underlying vessels."], ["Friction", false, "Friction is surface rubbing that damages the epidermis. The deeper sliding of layers is shear."], ["Moisture", false, "Moisture macerates skin but isn't the mechanism of sliding."], ["Direct pressure", false, "Pressure is perpendicular force over a bony prominence. Sliding adds parallel force."]], "r": "", "tip": "Sliding down in bed = shear at the sacrum. Lift, don't slide."}, {"id": "TI96", "u": "TI", "topic": "Pressure injury", "t": "single", "stem": "Which expected outcome is most appropriate for a client who has a stage 2 pressure injury?", "o": [["The wound does not deteriorate and stays free of infection", true, "Outcomes: no deterioration, no infection, complete healing, and no recurrence."], ["The wound is restaged as a stage 1 within 2 weeks", false, "Pressure injuries are never reverse staged."], ["The client develops no pressure injuries during the stay", false, "This outcome fits a client who doesn't already have one."], ["The Braden score rises to 19 or higher by discharge", false, "A Braden score reflects risk of new injury. It does not measure whether an existing wound heals or worsens."]], "r": "", "tip": "Prevent deterioration and infection, heal, and prevent recurrence. One injury means high risk for another."}, {"id": "ET2", "u": "ET", "topic": "Advocate role", "t": "sata", "stem": "The nurse is reviewing the advocate’s role with a group of students. Which actions reflect the advocate role? <em>Select all that apply.<\/em>", "o": [["Helping a client get through prior-authorization steps to obtain a home oxygen referral", true, ""], ["Teaching a client that they have the right to refuse a recommended treatment", true, ""], ["Explaining test results the provider shared so the client can weigh treatment options", true, ""], ["Involving the health care agent of a client who lacks decision-making capacity", true, ""], ["Choosing the treatment the nurse believes is safest for a client who is undecided", false, ""], ["Deferring to the provider’s plan when the client and provider disagree about care", false, ""], ["Holding distressing test results until the family agrees the client should hear them", false, ""]], "r": "<p>The advocate’s roles are to navigate the complex health care system, penetrate bureaucracy and access resources, protect and educate the client about their rights, provide information, support informed decisions, and work with clients who lack decision-making capacity.<\/p>\n<ul><li>Working through prior authorization is getting past bureaucracy to access resources.<\/li>\n<li>Teaching the right to refuse is educating the client about their rights.<\/li>\n<li>Interpreting results within scope is providing information for an informed decision.<\/li>\n<li>Involving the health care agent is working with a client who lacks capacity.<\/li>\n<li>Choosing for an undecided client replaces the client’s judgment with the nurse’s, even when well meant.<\/li>\n<li>Effective advocacy holds that the client’s rights and values take precedence when they conflict with the provider’s. Deferring automatically drops the client’s voice.<\/li>\n<li>Withholding results until the family agrees violates veracity and the client’s right to information, unless the client has asked for that arrangement.<\/li><\/ul>", "tip": ""}, {"id": "ET47", "u": "ET", "topic": "Ethics committee", "t": "sata", "stem": "The nurse is orienting a new graduate. Which statements accurately describe the purpose of a hospital ethics committee? <em>Select all that apply.<\/em>", "o": [["It develops policies to guide responses to recurring ethical situations.", true, ""], ["It provides ethics education for staff.", true, ""], ["It offers consultation when staff, clients, or families face an ethical dilemma.", true, ""], ["It is made up of members from several disciplines on the health care team.", true, ""], ["It makes final, binding treatment decisions in place of the client or surrogate.", false, ""], ["It disciplines staff members who are found to have acted unethically.", false, ""], ["It issues legal rulings on the facility’s liability in disputed cases.", false, ""]], "r": "<p>The ethics committee’s functions are to develop policies (“if this happens, then…”), education, and consultation. It is multidisciplinary, made up of several members of the health care team. It guides and supports the team, client, and family in reaching a decision.<\/p>\n<ul><li>Making final, binding decisions isn’t its role. It advises, and the client or legal surrogate keeps decision-making authority.<\/li>\n<li>Discipline belongs to management and human resources, and to licensing boards.<\/li>\n<li>Legal rulings come from risk management, legal counsel, and the courts.<\/li><\/ul>", "tip": ""}, {"id": "ET59", "u": "ET", "topic": "Equity, access, stigma, isolation", "t": "sata", "stem": "A nurse is preparing to perform a pelvic exam on a client with a known trauma history. Which actions reflect trauma-informed care? <em>Select all that apply.<\/em>", "o": [["Set up the room and equipment before the client comes in", true, ""], ["Sit at the client’s eye level while explaining the exam", true, ""], ["Describe each step and get the client’s agreement before going on", true, ""], ["Offer suggestions such as “Some people find a slow breath helpful here”", true, ""], ["Ask the client to describe her trauma so care can be tailored to it", false, ""], ["Give brief, firm directions so the exam is finished as quickly as possible", false, ""]], "r": "<p>Werner’s practical steps: be prepared (room ready so the client isn’t waiting while staff hunt for equipment), make eye contact at the same level instead of standing over the client, be transparent and get consent at each step, offer suggestions instead of directions, know grounding techniques, and work <em>with<\/em> clients instead of <em>on<\/em> them.<\/p>\n<ul><li>Asking her to describe the trauma is the key misconception. Trauma-informed care does not require the clinician to know the exact nature of the trauma, and asking can itself retraumatize.<\/li>\n<li>Firm directives remove the client’s sense of control. TIC aims to rebuild control and empowerment.<\/li><\/ul>", "tip": ""}, {"id": "ET1", "u": "ET", "topic": "Advocate role", "t": "single", "stem": "A client admitted with a COPD exacerbation tells the nurse, “You’re my advocate, so you’ll back me up when I tell the doctor I’m going home tonight.” Which response by the nurse <em>best<\/em> reflects the advocate role?", "o": [["“I’ll make sure you have the information you need to decide, and I’ll be honest about my concerns.”", true, ""], ["“I’ll support whatever you decide, because respecting your choice is my main job as your nurse.”", false, ""], ["“I’ll ask your provider to explain why staying is safer so you can make the choice we recommend.”", false, ""], ["“I’ll call your family so they can help you decide what is best for your health right now.”", false, ""]], "r": "<p>Advocacy is the protection and support of another’s rights. The nurse facilitates the client’s own decision by making sure it is an informed one, and stays impartial while doing so. Being an advocate does not mean blindly supporting everything the client decides. The nurse may disagree and say so, and still respect an informed choice.<\/p>\n<ul><li>Promising to support any decision is “blind support”. It skips the nurse’s duty to make sure the choice is informed.<\/li>\n<li>Steering the client toward “the choice we recommend” turns the nurse into the decision maker (paternalism). Advocates facilitate decisions; they don’t make them.<\/li>\n<li>Calling in family is appropriate when the client wants others involved. Doing it on the nurse’s initiative moves the decision away from a client with capacity.<\/li><\/ul>\n<p class=\"principle\"><b>Deciding principle:<\/b> facilitate an informed decision; don’t make it for the client or blindly endorse it.<\/p>", "tip": ""}, {"id": "ET3", "u": "ET", "topic": "Advocate role", "t": "single", "stem": "A 75-year-old client with heart failure, diabetes, and osteoporosis was discharged from the hospital to a skilled nursing facility after a hip fracture. Two days later she was in the emergency department because critical parts of her care plan never reached the facility. Which nursing action <em>most<\/em> directly addresses this failure?", "o": [["Verify a complete care-plan handoff that includes her preferences at every care transition", true, ""], ["Limit the number of providers involved in her care so fewer people need the information", false, ""], ["Give her a printed hospital medication list to carry with her to the nursing facility", false, ""], ["Schedule a primary care follow-up visit within 30 days of her final discharge home", false, ""]], "r": "<p>A client with several chronic conditions who moves between hospital, skilled nursing, and home can see about 20 providers in a month. The breakdowns are poor transfer of information between sites, little attention to the client’s or family’s preferences, and no single person coordinating and advocating for her.” Coordinating handoffs across settings and bringing the client’s values into each plan is the advocacy role this case shows was missing.<\/p>\n<ul><li>Fewer providers can’t be promised for complex chronic illness. The failure was in communication between settings, not headcount.<\/li>\n<li>A printed medication list is helpful but covers only part of the plan. It puts the coordination burden on the client.<\/li>\n<li>A 30-day follow-up comes too late. The harm happened within days of the first transition.<\/li><\/ul>\n<p class=\"principle\"><b>Deciding principle:<\/b> fragmented care between settings is fixed by coordinated, client-centered handoffs. The nurse acts as the broker of care.<\/p>", "tip": ""}, {"id": "ET5", "u": "ET", "topic": "Autonomy & empowerment", "t": "single", "stem": "An alert older adult client is scheduled to consent for surgery. He tells the nurse, “Please talk to my eldest son about this. In our family, he makes these decisions.” Which action by the nurse is <em>best<\/em>?", "o": [["Confirm this is the client’s own wish and include his son as the preferred decision maker", true, ""], ["Explain that as an alert adult he must make the surgical decision on his own", false, ""], ["Ask the surgeon to postpone the consent until the client is ready to decide alone", false, ""], ["Encourage him to decide first and then share his decision with his son afterward", false, ""]], "r": "<p>Not everyone wants to make their own treatment decisions. Forcing the decision-making role on a client who doesn’t want it violates the spirit of autonomy. Nurses can advocate by helping clients delegate decisions to a preferred decision maker they trust, and culturally competent care recognizes that some cultures assign that role to a particular family member. The nurse confirms the request comes from the client and follows facility policy for formal delegation, such as a health care directive.<\/p>\n<ul><li>Telling him he must decide alone confuses autonomy with independence. Choosing to delegate is itself an autonomous choice.<\/li>\n<li>Postponing until he will decide alone delays care and still refuses his stated preference.<\/li>\n<li>Having him decide first and inform his son later overrides the decision process he asked for.<\/li><\/ul>\n<p class=\"principle\"><b>Deciding principle:<\/b> respect self-determination, including a client’s choice to delegate the decision.<\/p>", "tip": ""}, {"id": "ET7", "u": "ET", "topic": "Autonomy & empowerment", "t": "single", "stem": "An alert resident in long-term care is now at high risk for falls but refuses to use the call light before getting out of bed. A newer nurse suggests obtaining a restraint order “for her own good.” Which action by the nurse is <em>best<\/em>?", "o": [["Explore why she avoids the call light and plan less restrictive safety measures with her", true, ""], ["Obtain a restraint order because preventing a serious injury outweighs her preference", false, ""], ["Raise all four side rails at night so she cannot get out of bed without assistance", false, ""], ["Document her refusal and notify the family that she has chosen to accept the risk", false, ""]], "r": "<p>Acting as a “parent” and overriding an alert resident’s wishes because the nurse believes it is in her best interest violates autonomy, and restraints carry their own harms. The ethical path is to assess first (why she won’t call: wait times, dignity, toileting urgency) and then build a plan with her using the least restrictive options, such as a low bed, a bed alarm, scheduled toileting, and hourly rounding.<\/p>\n<ul><li>A restraint order is the paternalistic option the scenario asks about. Restraints also increase injury and delirium risk.<\/li>\n<li>Four raised side rails are a physical restraint, so this is the same choice in different form.<\/li>\n<li>Documenting and notifying the family respects her choice but leaves out any assessment or safety planning. That is incomplete advocacy.<\/li><\/ul>\n<p class=\"principle\"><b>Deciding principle:<\/b> assess before intervening, and choose the least restrictive option that respects autonomy.<\/p>", "tip": ""}, {"id": "ET8", "u": "ET", "topic": "Autonomy & empowerment", "t": "single", "stem": "A client with limited English proficiency nods and says “yes” when asked in English whether she has any questions about the surgical consent form. What should the nurse do <em>first<\/em>?", "o": [["Request a qualified medical interpreter before the consent discussion is completed", true, ""], ["Ask her bilingual teenage son to translate the consent form for her at the bedside", false, ""], ["Read the form aloud slowly and then ask her again whether she understands it", false, ""], ["Give her a copy of the English form so she can review it at home with her family", false, ""]], "r": "<p>It is intimidating for a client to admit not understanding, so a nod and a “yes” do not show comprehension. An informed decision requires information in a language she understands. The nurse advocates by getting a qualified medical interpreter, and written materials in her language if available, and alerts the provider before consent is signed.<\/p>\n<ul><li>A family member, especially a minor, may translate inaccurately, filter information, and breach privacy. A qualified interpreter is the standard.<\/li>\n<li>Reading English slowly doesn’t solve a language barrier, and “Do you understand?” invites the same yes.<\/li>\n<li>Sending her home with an English form puts translation on her family and delays an informed decision.<\/li><\/ul>", "tip": ""}, {"id": "ET9", "u": "ET", "topic": "Advocacy in practice", "t": "single", "stem": "A resident is attempting a lumbar puncture on an adolescent. After one failed attempt the adolescent says, “Stop. I don’t want you to do this anymore.” The resident asks the nurse to give a PRN antianxiety medication so the procedure can be finished quickly. What should the nurse do <em>first<\/em>?", "o": [["Tell the resident the procedure must stop while the adolescent’s refusal is addressed", true, ""], ["Give the antianxiety medication as ordered and then reassess the adolescent’s anxiety", false, ""], ["Hold the adolescent’s position firmly so the second attempt can be done more quickly", false, ""], ["Call the parents to obtain their permission for the resident to make a second attempt", false, ""]], "r": "<p>This is the “valid consent or refusal” scenario. Consent can be withdrawn at any time. Sedating a client so a procedure can continue over their objection overrides autonomy and is not a legitimate use of the medication. The nurse’s first move is to stop the procedure. Then the team can find out why the adolescent refused (pain, fear, distrust of this resident) and involve the parents, since a minor’s care needs parental consent together with the adolescent’s assent.<\/p>\n<ul><li>Giving the medication to finish the procedure uses a drug to override a refusal. That fails both autonomy and nonmaleficence.<\/li>\n<li>Holding the adolescent in position continues the procedure against a stated refusal.<\/li>\n<li>Calling the parents is a reasonable next step, but the procedure has to stop before anyone seeks permission to continue.<\/li><\/ul>\n<p class=\"principle\"><b>Deciding principle:<\/b> stop the harm in progress first, then gather information and involve the right decision makers.<\/p>", "tip": ""}, {"id": "ET10", "u": "ET", "topic": "Advocacy in practice", "t": "single", "stem": "A client with decision-making capacity has declined a feeding tube after a stroke. The provider wants to proceed because “the family majority agrees,” and the client’s spouse is upset. Which action by the nurse <em>best<\/em> demonstrates effective advocacy?", "o": [["Communicate the client’s refusal to the provider and request a care conference", true, ""], ["Prepare for insertion because the family majority agrees with the provider’s plan", false, ""], ["Ask the spouse to persuade the client to accept the feeding tube before tomorrow", false, ""], ["Document the disagreement and let the provider and family settle the decision", false, ""]], "r": "<p>Effective advocacy means being assertive and recognizing that the client’s rights and values take precedence when they conflict with those of providers or others. Conflicts may come up between the nurse and providers, administrators, other team members, or family. A capable client’s informed refusal stands. The nurse makes sure the provider hears it and brings the team and family together.<\/p>\n<ul><li>A family majority has no authority over a client who has capacity.<\/li>\n<li>Enlisting the spouse to persuade the client turns the nurse into a pressure source instead of a protector of the client’s rights.<\/li>\n<li>Documenting and stepping aside is passive. Advocacy requires assertively carrying the client’s voice forward.<\/li><\/ul>", "tip": ""}, {"id": "ET67", "u": "ET", "topic": "Advocacy in practice", "t": "single", "stem": "A nurse notices that several clients with diabetes ration insulin because of cost, even with insurance. Which action addresses this problem at the <em>policy<\/em> level?", "o": [["Contact state legislators in support of a bill that caps insulin out-of-pocket costs", true, ""], ["Refer each affected client to social work for a manufacturer assistance program", false, ""], ["Ask the provider to consider lower-cost insulin options for the affected clients", false, ""], ["Raise the pattern at the next unit staff meeting so other nurses watch for it", false, ""]], "r": "<p>Advocacy can expand beyond the bedside. Effective advocacy may require political action, and nurses can influence health care at the legislative level in many ways. Provision 9 commits nurses to working on policies and legislation that eliminate health inequities. Contacting legislators addresses the cause for all affected clients.<\/p>\n<ul><li>A social work referral is good individual advocacy and should happen, but it helps one client at a time and leaves the policy unchanged.<\/li>\n<li>Lower-cost insulin is also appropriate at the individual level. It isn’t a policy-level action.<\/li>\n<li>Raising it at a staff meeting builds awareness inside the unit only.<\/li><\/ul>", "tip": ""}, {"id": "ET14", "u": "ET", "topic": "Ethical issues & trends", "t": "single", "stem": "A nurse skipped an independent double-check on a high-alert infusion after her charge nurse told her to “just hang it, we’re slammed.” The client was harmed. Weeks later the nurse describes guilt, shame, a sense of spiritual crisis, and no longer trusting the hospital. This presentation is <em>most<\/em> consistent with which concept?", "o": [["Moral injury", true, ""], ["Moral distress", false, ""], ["Moral uncertainty", false, ""], ["Burnout", false, ""]], "r": "<p>Moral injury happens when there has been a betrayal of what is right, by someone in authority or by oneself, in a high-stakes situation. It describes emotional, spiritual, and psychological wounds. A study of nurses involved in patient safety incidents found exactly these symptoms: guilt, shame, spiritual or existential crisis, and loss of trust in the system.<\/p>\n<ul><li>Moral distress is knowing the right action but being blocked from it by institutional constraints. Here the right action was abandoned under authority pressure and harm resulted, which is betrayal in a high-stakes event.<\/li>\n<li>Moral uncertainty is a vague sense that something is wrong without knowing which principle applies. This nurse knows exactly what went wrong.<\/li>\n<li>Burnout can follow repeated moral injury, but it is cumulative exhaustion. It doesn’t name this event-linked wound.<\/li><\/ul>", "tip": ""}, {"id": "ET17", "u": "ET", "topic": "Ethical issues & trends", "t": "single", "stem": "Restructuring has left a rural hospital’s unit chronically understaffed, and a nurse believes clients are at risk. Her brother, a newspaper reporter, offers to write a story. Which action should the nurse take <em>first<\/em>?", "o": [["Report the specific safety concerns to the charge nurse and follow the chain of command", true, ""], ["Give her brother the details so the public learns about the staffing risk right away", false, ""], ["Join coworkers who are planning a strike so management is forced to add staff", false, ""], ["Request a transfer to a better-staffed unit so her own license is not put at risk", false, ""]], "r": "<p>Provision 6 of the ANA Code commits nurses to improving the ethical environment of the work setting, including advocating for safe staffing. The chain of command comes first: charge nurse, then nurse manager, then administration, with written documentation of specific unsafe conditions.<\/p>\n<ul><li>Going to the media is a last resort after internal channels fail. Done first, it can breach confidentiality and skip legitimate fixes.<\/li>\n<li>A strike is a collective action with serious consequences for clients in the only local hospital. It isn’t a first step.<\/li>\n<li>A transfer protects the nurse but abandons the advocacy duty to the clients still at risk.<\/li><\/ul>", "tip": ""}, {"id": "ET20", "u": "ET", "topic": "Ethical issues & trends", "t": "single", "stem": "During morning rounds a client tells the nurse that a night-shift nurse touched her inappropriately and made suggestive comments. The day nurse likes the accused colleague and suspects the client may be trying to cause trouble. What should the nurse do?", "o": [["Report the client’s statement to the supervisor per policy without judging whether it is true", true, ""], ["Ask the night nurse privately what happened before deciding whether to report it", false, ""], ["Question the client further to judge whether her account is believable enough to report", false, ""], ["Document the statement and let the next charge nurse decide whether to escalate", false, ""]], "r": "<p>The nurse’s primary commitment is to the client (ANA Provision 2), and loyalty to colleagues must not compromise it. An allegation of sexual misconduct is reported promptly through the facility’s process. It is not the nurse’s job to decide whether it’s credible. The scenario also tests bias: liking the colleague and suspecting the client are exactly the feelings the “questions to ask” list tells the nurse to examine.<\/p>\n<ul><li>Asking the accused nurse first can compromise the investigation and lets loyalty override the duty to the client.<\/li>\n<li>Questioning the client to judge credibility puts the nurse in an investigator’s role and lets bias filter the report.<\/li>\n<li>Documenting and handing it off delays protection. Reporting is the nurse’s own responsibility.<\/li><\/ul>", "tip": ""}, {"id": "ET22", "u": "ET", "topic": "Ethical issues & trends", "t": "single", "stem": "A classmate shows a nursing student her social media post: a photo of a client’s large sacral pressure injury. She says it isn’t a privacy violation because the client is lying face down. Which response is <em>best<\/em>?", "o": [["“Take it down now. Any image of a client from clinical violates privacy, face or no face.”", true, ""], ["“Crop out any tattoos or marks first so the client can’t be identified from the photo.”", false, ""], ["“Change the post’s settings so only our classmates are able to see the photo.”", false, ""], ["“Ask the client for verbal permission next shift so the post can stay up.”", false, ""]], "r": "<p>Privacy and confidentiality are values in the ANA Code. Images taken during care are protected health information. The setting, the date, the unit, or a recognizable wound can identify a client even when the face doesn’t show. The post has to be removed, and the student should follow program policy for reporting it.<\/p>\n<ul><li>Cropping identifying marks still leaves a care-related image posted without authorization. This is the common misconception the scenario tests.<\/li>\n<li>Limiting the audience doesn’t change the breach. Posts can be shared and saved.<\/li>\n<li>Verbal permission at the bedside isn’t valid authorization under facility and program policy, and a dependent client may feel pressured to agree.<\/li><\/ul>", "tip": ""}, {"id": "ET27", "u": "ET", "topic": "Ethical issues & trends", "t": "single", "stem": "A nurse manager asks a nurse to finish a discharge quickly to free a bed. The client with a new urinary diversion still cannot demonstrate self-catheterization. Which response by the nurse aligns <em>best<\/em> with Provision 2 of the ANA Code?", "o": [["Explain the client is not yet safe for discharge and ask for time or a home-care referral", true, ""], ["Complete the discharge because bed flow affects every client waiting in the ED", false, ""], ["Discharge the client with written catheter instructions and a phone number to call", false, ""], ["Ask the client whether he is willing to go home now so the unit can admit others", false, ""]], "r": "<p>Provision 2 states that the nurse’s primary commitment is to the recipient of nursing care. If institutional pressure compromises client safety, the nurse is ethically bound to speak up. The client hasn’t shown competence with a critical skill, so the nurse advocates for more teaching time or home-care support.<\/p>\n<ul><li>Pointing to bed flow is a real system concern, but it puts institutional needs ahead of the client in front of the nurse. This is a conflict between the individual good and the good of society.<\/li>\n<li>Written instructions alone don’t make up for a failed demonstration, especially if health literacy is a factor.<\/li>\n<li>Asking him to leave to make room puts pressure on his decision and moves the nurse’s responsibility onto him.<\/li><\/ul>", "tip": ""}, {"id": "ET68", "u": "ET", "topic": "Ethical issues & trends", "t": "single", "stem": "A nurse tells her manager in advance that she will not take part in a procedure because it violates her personal and professional ethical beliefs, and she asks that the client’s care be reassigned. This is an example of:", "o": [["Conscientious objection", true, ""], ["Moral distress", false, ""], ["Moral injury", false, ""], ["Paternalism", false, ""]], "r": "<p>Conscientious objection is refusing to participate in certain kinds of treatment and care because they violate the nurse’s personal and professional ethics, beliefs, and standards. Telling the manager in advance and asking for reassignment keeps the client from being abandoned.<\/p>\n<ul><li>Moral distress is knowing the right action but being blocked by institutional constraints. This nurse isn’t blocked; she is declining to take part.<\/li>\n<li>Moral injury is a wound from a betrayal of what is right in a high-stakes situation.<\/li>\n<li>Paternalism is overriding a client’s wishes for their supposed good.<\/li><\/ul>", "tip": ""}, {"id": "ET37", "u": "ET", "topic": "Ethical principles", "t": "single", "stem": "A hospice client with terminal lung cancer has severe dyspnea. Morphine is titrated to relieve it, and the family worries it might “speed things up.” Which ethical principle justifies giving the morphine?", "o": [["Double effect", true, ""], ["Distributive justice", false, ""], ["Veracity", false, ""], ["Paternalism", false, ""]], "r": "<p>The principle of double effect is the moral justification of an action that produces both good and bad effects. Here the intended good is relief of suffering, and a foreseen but unintended possible effect is respiratory depression. It is a double-edged sword. It applies when the intent is the good effect and the good outweighs the possible harm.<\/p>\n<ul><li>Distributive justice is about fair allocation of benefits and burdens across people.<\/li>\n<li>Veracity is truth-telling. It matters in talking with the family but doesn’t justify the action itself.<\/li>\n<li>Paternalism means overriding a client’s wishes for their supposed good. Nothing here overrides the client.<\/li><\/ul>", "tip": ""}, {"id": "ET38", "u": "ET", "topic": "Ethical principles", "t": "single", "stem": "During a mass-casualty event with limited blood products, the nurse directs a unit of blood to a client with survivable injuries rather than to a client whose assessment shows death is imminent. Which principle guides this decision?", "o": [["Distributive justice", true, ""], ["Beneficence", false, ""], ["Nonmaleficence", false, ""], ["Double effect", false, ""]], "r": "<p>Distributive justice means benefits and burdens are distributed fairly when resources are scarce. Directing limited resources to the client most likely to benefit is an allocation decision.<\/p>\n<ul><li>Beneficence is doing good for an individual client. It doesn’t settle who gets a scarce resource.<\/li>\n<li>Nonmaleficence is avoiding harm. Withholding blood from either client could be framed as harm, so it can’t decide the case.<\/li>\n<li>Double effect applies to a single action with good and bad effects, not to choosing between clients.<\/li><\/ul>", "tip": ""}, {"id": "ET39", "u": "ET", "topic": "Ethical principles", "t": "single", "stem": "A unit is short one nurse. The nurse’s assignment includes a 33-year-old recovering from an MI who goes home tomorrow and says he still has many questions; an older adult receiving comfort care who is close to death; and a client with cancer who has been vomiting all day and reports severe pain. The nurse especially likes the client going home. Which client should the nurse see <em>first<\/em>?", "o": [["The client with cancer who is vomiting and reporting severe pain", true, ""], ["The client recovering from an MI who has questions before discharge", false, ""], ["The older adult receiving comfort care who is close to death", false, ""], ["Whichever client the nurse can finish with most quickly before rounding", false, ""]], "r": "<p>This is the allocation-of-scarce-nursing-resources scenario. Distributive justice means care goes by need, not by which client the nurse likes. Ongoing vomiting with severe pain is an <em>actual<\/em>, acute, uncontrolled problem with risks of aspiration, fluid and electrolyte loss, and suffering. It comes first.<\/p>\n<ul><li>The client with discharge questions has a real but stable, non-urgent teaching need. It can be scheduled later in the shift, and the nurse’s fondness for him is the bias the scenario is testing.<\/li>\n<li>The client near death on comfort care deserves presence and comfort, but the stem gives no acute distress. Comfort care is planned and anticipated, and a scheduled check can cover it.<\/li>\n<li>Picking the quickest client is a workload strategy, not an ethical or clinical way to prioritize.<\/li><\/ul>\n<p class=\"principle\"><b>Deciding principle:<\/b> actual and acute over stable, and allocation by need rather than preference.<\/p>", "tip": ""}, {"id": "ET40", "u": "ET", "topic": "Ethical principles", "t": "single", "stem": "Which statement correctly distinguishes ethics from morals?", "o": [["Ethics is the formal, systematic study of moral beliefs; morals are more personal and informal", true, ""], ["Morals are the formal, systematic study of beliefs; ethics are personal values a person holds", false, ""], ["Ethics apply only to health care decisions, while morals apply to decisions in everyday life", false, ""], ["Ethics and morals mean the same thing and the terms can be used interchangeably in nursing", false, ""]], "r": "<p>Ethics is the formal, systematic study of moral beliefs, used to understand, analyze, and evaluate right and wrong. Morality refers to specific values, characteristics, or actions, which ethical analysis examines. Morals are “more informal and personal” than ethics.<\/p>\n<ul><li>Calling morals the formal study and ethics personal values reverses the two definitions.<\/li>\n<li>Ethics isn’t limited to health care. Bioethics is the branch focused on human nature, behavior, and health.<\/li>\n<li>The terms overlap, but they are distinct concepts.<\/li><\/ul>", "tip": ""}, {"id": "ET45", "u": "ET", "topic": "Decision-making model", "t": "single", "stem": "A 15-year-old with a newly diagnosed terminal illness asks the nurse, “Am I going to die?” Her parents have asked staff not to tell her the diagnosis, and the nurse feels strongly that the teen deserves to know. What should the nurse do <em>first<\/em>?", "o": [["Ask what she understands about her illness and what prompted her question", true, ""], ["Tell her the truth about her diagnosis, since veracity is owed to her", false, ""], ["Tell her those questions are best answered by her parents and her provider", false, ""], ["Request an ethics committee consult about the parents’ request to withhold", false, ""]], "r": "<p>Before acting on the dilemma, the nurse works through the questions to ask: What do I know? What are the patient’s values? What assumptions am I making about her maturity? Are my own values (“I’d want to know”) shaping my view? Family or cultural beliefs about how serious illness is discussed may be behind the parents’ request, and the nurse can’t know that without asking. The first step is assessment, which means exploring the teen’s understanding and concerns.<\/p>\n<ul><li>Disclosing now acts on the nurse’s values before gathering data. It overrides the parents and any cultural context, and the diagnosis is the provider’s to share.<\/li>\n<li>Deflecting to her parents and provider shuts down a frightened adolescent and skips assessment.<\/li>\n<li>An ethics consult is likely appropriate, but information is gathered <em>before<\/em> taking a case to the committee.<\/li><\/ul>\n<p class=\"principle\"><b>Deciding principle:<\/b> assess before intervening. Assessment comes first even when the next action seems obvious.<\/p>", "tip": ""}, {"id": "ET70", "u": "ET", "topic": "Decision-making model", "t": "single", "stem": "A nurse is caring for a child whose parent is under a confidential child protective services investigation for suspected medical child abuse. The nurse is frustrated that she can’t learn the details. Which ethical-analysis question applies <em>most<\/em> directly?", "o": [["“What can I never know about this case?”", true, ""], ["“What else do I need to know, and where can I find it?”", false, ""], ["“What are the patient’s values and moral preferences?”", false, ""], ["“Are my own values in conflict with the patient’s?”", false, ""]], "r": "<p>Some information can never be known by bedside staff because the investigation is confidential. Recognizing that limit lets the nurse focus on what she can control: staying truthful within it (veracity), respecting the process, and partnering with providers, the client, and the family to make the best of a hard situation.<\/p>\n<ul><li>“What else do I need to know?” is the near-miss. It assumes the information can be found, but here it is deliberately unavailable.<\/li>\n<li>Asking about the patient’s values matters in general but doesn’t speak to the nurse’s frustration about missing information.<\/li>\n<li>Nothing in the stem describes a conflict between the nurse’s and the patient’s values.<\/li><\/ul>", "tip": ""}, {"u": "ET", "topic": "Decision-making model", "t": "single", "stem": "A client’s family asks the nurse not to tell the client about a new cancer diagnosis. The nurse feels torn between honesty and the family’s wishes. Using the ethical decision-making process, what should the nurse do first?", "o": [["Assess the situation and gather data", true, ""], ["Identify the ethical problem", false, ""], ["Identify and weigh the alternatives", false, ""], ["Request a consult from the ethics committee", false, ""]], "r": "<p>Ethical decision making follows the nursing process: assess the situation and gather data, identify the ethical problem, identify and weigh alternatives, implement the decision, and evaluate it.<\/p><ul><li>Naming the ethical problem is the second step. The nurse can’t define it accurately without facts such as what the client already knows, the client’s decision-making capacity, and the family’s reasons.<\/li><li>Weighing alternatives is planning, which comes after the problem is defined.<\/li><li>An ethics committee consult is a resource for unresolved dilemmas, not the first step for the bedside nurse.<\/li><\/ul><p class=\"principle\"><b>Deciding principle:<\/b> assess before you intervene, even when the dilemma seems obvious.<\/p>", "tip": "", "id": "ET44c"}, {"id": "ET49", "u": "ET", "topic": "Equity, access, stigma, isolation", "t": "single", "stem": "Which intervention reflects health <em>equity<\/em> rather than health equality?", "o": [["Arranging wheelchair-accessible transport so a client can attend the same rehab sessions", true, ""], ["Giving every client on the unit the same printed discharge booklet at discharge", false, ""], ["Scheduling all clients for the same 15-minute follow-up visit after discharge", false, ""], ["Offering the same bus voucher to every client regardless of their mobility", false, ""]], "r": "<p>Equality gives everyone the same thing. Equity gives each person what they need to reach the same outcome, here access to care. A person who uses a wheelchair needs accessible facilities or transport to get where everyone else is going; giving everyone the same bus pass would not get them there.<\/p>\n<ul><li>The identical booklet, the identical 15-minute visit, and the identical voucher are all equality. Each gives the same resource no matter the need, so clients with greater barriers still fall short.<\/li><\/ul>", "tip": ""}, {"id": "ET50", "u": "ET", "topic": "Equity, access, stigma, isolation", "t": "single", "stem": "A nurse notices she spends less time in the room of a client admitted with alcohol withdrawal and answers his call light last. What should the nurse do <em>first<\/em>?", "o": [["Reflect on how her feelings about his diagnosis may be shaping the care she gives", true, ""], ["Ask the charge nurse to reassign him to a nurse with more addiction experience", false, ""], ["Limit her time in the room to required tasks so her personal views don’t show", false, ""], ["Tell the client that his diagnosis makes some staff members uncomfortable", false, ""]], "r": "<p>Stigma and internal bias are shaped by our experiences, often unintentional, and able to change the care a client receives. The first step is self-reflection: noticing how you view the person and how that affects how you treat them. Stigma attached to substance u
